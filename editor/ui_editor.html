}
/* ------------------------------- 代码弹窗 ------------------------------- */
function openCode() {
  generatedCode = generateCode(project);
  $('#codeOut').textContent = generatedCode;
  $('#codeModal').classList.remove('hidden');
}
function closeCode() { $('#codeModal').classList.add('hidden'); }
async function copyCode() {
  try {
    await navigator.clipboard.writeText(generatedCode);
    toast('已复制到剪贴板');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = generatedCode;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (_) { toast('复制失败，请手动选择'); }
    ta.remove();
  }
}

/* ------------------------------- 初始化/事件 ------------------------------- */
function renderAll() {
  $('#projectName').value = project.name || '';
  $('#gridSize').textContent = project.grid;
  $('#guideCols').value = project.guideCols;
  $('#guideRows').value = project.guideRows;
  $('#guideChk').checked = project.showGuides;
  $('#guideSnapChk').checked = project.snapGuides;
  renderPageTabs();
  renderStage();
  renderLayers();
  renderProps();
  fitIfNeeded();
  saveLocal();
}

function loadProject(p, silent) {
  project = normalizeProject(p);
  selectedUid = null;
  undoStack = [];
  redoStack = [];
  zoomMode = 'fit';
  renderAll();
  if (!silent) toast('已载入');
}

function init() {
  const params = new URLSearchParams(location.search);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { saved = null; }
  project = saved ? normalizeProject(saved) : sampleProject();
  if (params.has('empty')) project = blankProject();
  if (params.get('layout') === 'fixed') project.layout = 'fixed';
  if (params.get('layout') === 'percent') project.layout = 'percent';
  if (params.has('guides')) {
    project.showGuides = true;
    project.guideCols = clamp(Math.round(num(params.get('cols'), 4)), 1, 64);
    project.guideRows = clamp(Math.round(num(params.get('rows'), 3)), 1, 64);
  }
  const menudir = params.get('menudir');
  if (['down', 'up', 'left', 'right', 'fan'].includes(menudir)) {
    const m = project.widgets.find(w => w.type === 'menu') || project.pages[1]?.widgets.find(w => w.type === 'menu');
    if (m) {
      m.expandDir = menudir;
      syncMenuHeight(m);
      fitMenuToStage(m);
    }
  }

  // 项目名
  $('#projectName').addEventListener('input', e => {
    project.name = e.target.value;
    saveLocal();
  });

  // 工具栏
  $('#btnNew').addEventListener('click', () => {
    if (project.widgets.length && !confirm('新建会清空当前界面，继续？')) return;
    loadProject(blankProject());
  });
  $('#btnSample').addEventListener('click', () => {
    if (project.widgets.length && !confirm('用示例替换当前界面？')) return;
    loadProject(sampleProject());
  });
  $('#btnOpen').addEventListener('click', () => $('#fileOpen').click());
  $('#fileOpen').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { loadProject(JSON.parse(r.result)); }
      catch (err) { toast('JSON 解析失败'); }
    };
    r.readAsText(f, 'utf-8');
    e.target.value = '';
  });
  $('#btnSave').addEventListener('click', () => {
    download((project.name || 'ui') + '.json', JSON.stringify(serializeProject(), null, 2), 'application/json');
  });
  $('#btnUndo').addEventListener('click', undo);
  $('#btnRedo').addEventListener('click', redo);
  $('#btnCode').addEventListener('click', openCode);
  $('#btnPreview').addEventListener('click', () => {
    if (document.body.classList.contains('preview')) exitPreview();
    else enterPreview();
  });
  $('#previewExit').addEventListener('click', exitPreview);

  // 添加
  $$('.pal-btn').forEach(b => b.addEventListener('click', () => addWidget(b.dataset.add)));

  // 页面标签
  $('#pageTabs').addEventListener('click', e => {
    const close = e.target.closest('[data-close]');
    if (close) { deletePage(Number(close.dataset.close)); return; }
    const tab = e.target.closest('.page-tab[data-index]');
    if (tab) switchPage(Number(tab.dataset.index));
  });
  $('#pageTabs').addEventListener('dblclick', e => {
    const tab = e.target.closest('.page-tab[data-index]');
    if (tab) renamePage(Number(tab.dataset.index));
  });

  // 图层
  $('#layers').addEventListener('click', e => {
    const row = e.target.closest('.layer');
    if (!row) return;
    const uidValue = row.dataset.uid;
    const action = e.target.dataset.action;
    if (action) {
      const w = project.widgets.find(x => x.uid === uidValue);
      if (!w) return;
      if (action === 'toggle') { historyPush(); w.visible = w.visible === false; renderStage(); renderLayers(); saveLocal(); }
      else if (action === 'up') moveLayer(uidValue, 1);
      else if (action === 'down') moveLayer(uidValue, -1);
      return;
    }
    select(uidValue);
  });

  // 画布
  $('#stage').addEventListener('pointerdown', e => {
    if (document.body.classList.contains('preview')) {
      const el = e.target.closest('.widget');
      if (!el) {
        closePreviewMenus(null);
        return;
      }
      if (el) {
        const w = project.widgets.find(x => x.uid === el.dataset.uid);
        if (w && w.visible !== false && w.enabled !== false) {
          if (w.type === 'button') {
            e.preventDefault();
            previewClick(w);
          } else if (w.type === 'menu') {
            const part = e.target.closest('[data-menu-part]');
            if (part && part.dataset.menuPart === 'header') {
              e.preventDefault();
              previewMenuOpen[w.uid] = w.trigger === 'hover' ? true : !previewMenuOpen[w.uid];
              addPreviewLog(`伸缩菜单“${w.text || '菜单'}” ${previewMenuOpen[w.uid] ? '展开' : '收起'}`);
              renderStage();
            } else if (part && part.dataset.menuPart === 'item') {
              e.preventDefault();
              const item = w.items[Number(part.dataset.index)];
              if (!item || item.enabled === false) return;
              let ti = -1;
              let tn = '';
              if (item.target) {
                ti = project.pages.findIndex(pg => pg.key === item.target);
                if (ti >= 0) tn = project.pages[ti].name;
              }
              const code = handlerCodeSnippet(item.handler);
              if (ti >= 0) {
                addPreviewLog(`菜单项“${item.text}” → 跳转“${tn}”${code ? '；其他逻辑：' + code : ''}`);
                if (w.closeOnSelect) previewMenuOpen[w.uid] = false;
                switchPage(ti, true);
                renderStage();
                toast(`跳转“${tn}”${code ? '，还会执行其他逻辑' : ''}`, 2200);
              } else if (code) {
                addPreviewLog(`菜单项“${item.text}” → 其他逻辑：${code}`);
                toast('菜单项会执行其他逻辑（见左下角）', 2200);
              } else {
                addPreviewLog(`菜单项“${item.text}” → 逻辑在 onMenu_${cppIdent(w.id, 'MENU_1')}_Item${Number(part.dataset.index) + 1}()`);
                toast('菜单项逻辑在生成的 onMenu_... 回调里', 2200);
              }
              if (w.closeOnSelect && previewMenuOpen[w.uid] && ti < 0) {
                previewMenuOpen[w.uid] = false;
                renderStage();
              }
            }
          }
        }
      }
      return;
    }
    const handle = e.target.closest('.handle');
    if (handle) {
      const w = selected();
      if (w) startDrag(e, w, 'resize', handle.dataset.dir);
      return;
    }
    const el = e.target.closest('.widget');
    if (!el) { select(null); return; }
    const w = project.widgets.find(x => x.uid === el.dataset.uid);
    if (!w) return;
    select(w.uid);
    if (e.button === 0) startDrag(e, w, 'move');
  });
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  // 属性
  $('#props').addEventListener('input', onPropInput);
  $('#props').addEventListener('change', e => {
    const fileKind = e.target.dataset.file;
    if (fileKind) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      if (fileKind === 'bg') {
        r.onload = () => { project.bgPreviewData = r.result; renderStage(); };
      } else {
        const w = selected();
        if (!w) return;
        r.onload = () => {
          if (fileKind === 'icon') w.iconPreviewData = r.result;
          else if (fileKind === 'bgimg') w.bgPreviewData = r.result;
          else w.previewData = r.result;
          renderStage();
        };
      }
      r.readAsDataURL(f);
      return;
    }
    if (e.target.dataset.prop || e.target.dataset.itemProp) onPropInput(e);
  });
  $('#props').addEventListener('click', e => {
    const itemAction = e.target.dataset.itemAction;
    if (itemAction) {
      const mw = selected();
      if (!mw || mw.type !== 'menu') return;
      const idx = Number(e.target.dataset.index);
      historyForce();
      if (itemAction === 'add') {
        mw.items.push({ text: '新菜单项', target: '', itemBg: '', itemHoverBg: '', textColor: '', fontSize: 0, enabled: true, handler: '' });
      } else if (itemAction === 'del') {
        mw.items.splice(idx, 1);
      } else if (itemAction === 'up' && idx > 0) {
        const t = mw.items[idx - 1]; mw.items[idx - 1] = mw.items[idx]; mw.items[idx] = t;
      } else if (itemAction === 'down' && idx < mw.items.length - 1) {
        const t = mw.items[idx + 1]; mw.items[idx + 1] = mw.items[idx]; mw.items[idx] = t;
      }
      syncMenuHeight(mw);
      fitMenuToStage(mw);
      renderStage();
      renderProps();
      saveLocal();
      return;
    }
    const action = e.target.dataset.action;
    if (!action) return;
    const w = selected();
    if (action === 'add-page') { addPage(); return; }
    if (action === 'load-sample') { loadProject(sampleProject()); return; }
    if (action === 'clear-all') {
      if (!confirm('清空所有控件？')) return;
      historyForce(); project.widgets.length = 0; selectedUid = null; renderAll(); return;
    }
    if (!w) return;
    if (action === 'del') deleteSelected();
    else if (action === 'dup') duplicateSelected();
    else if (action === 'center-h') { historyForce(); w.centerH = true; applyCentering(w); renderStage(); renderSelection(); syncPosFields(); saveLocal(); }
    else if (action === 'center-v') { historyForce(); w.centerV = true; applyCentering(w); renderStage(); renderSelection(); syncPosFields(); saveLocal(); }
    else if (action === 'center') { historyForce(); w.centerH = true; w.centerV = true; applyCentering(w); renderStage(); renderSelection(); syncPosFields(); saveLocal(); }
    else if (action === 'up') moveLayer(w.uid, 1);
    else if (action === 'down') moveLayer(w.uid, -1);
    else if (action === 'top') { historyForce(); const i = project.widgets.indexOf(w); project.widgets.splice(i, 1); project.widgets.push(w); renderAll(); }
    else if (action === 'bottom') { historyForce(); const i = project.widgets.indexOf(w); project.widgets.splice(i, 1); project.widgets.unshift(w); renderAll(); }
  });

  // 网格/缩放
  $('#snapChk').addEventListener('change', e => { snap = e.target.checked; });
  const syncGuides = () => {
    project.guideCols = clamp(Math.round(num($('#guideCols').value, 4)), 1, 64);
    project.guideRows = clamp(Math.round(num($('#guideRows').value, 3)), 1, 64);
    project.showGuides = $('#guideChk').checked;
    project.snapGuides = $('#guideSnapChk').checked;
    $('#guideCols').value = project.guideCols;
    $('#guideRows').value = project.guideRows;
    renderGuides();
    saveLocal();
  };
  $('#guideCols').addEventListener('change', syncGuides);
  $('#guideRows').addEventListener('change', syncGuides);
  $('#guideChk').addEventListener('change', syncGuides);
  $('#guideSnapChk').addEventListener('change', syncGuides);
  $('#zoomSel').addEventListener('change', applyZoomSelection);
  window.addEventListener('resize', fitIfNeeded);

  // 代码弹窗
  $('#btnCopy').addEventListener('click', copyCode);
  $('#btnDownload').addEventListener('click', () => download('ui_generated.cpp', generatedCode, 'text/plain;charset=utf-8'));
  $('#btnCloseModal').addEventListener('click', closeCode);
  $('#codeModal').addEventListener('click', e => { if (e.target.id === 'codeModal') closeCode(); });

  // 键盘
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.body.classList.contains('preview')) {
      e.preventDefault();
      exitPreview();
      return;
    }
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'Escape') {
      if (!$('#codeModal').classList.contains('hidden')) closeCode();
      else select(null);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); download((project.name || 'ui') + '.json', JSON.stringify(serializeProject(), null, 2), 'application/json'); return; }
    const w = selected();
    if (!w) return;
    const step = e.shiftKey ? 10 : 1;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
      e.preventDefault();
      historyPush();
      if (e.key === 'ArrowLeft') w.x -= step;
      if (e.key === 'ArrowRight') w.x += step;
      if (e.key === 'ArrowUp') w.y -= step;
      if (e.key === 'ArrowDown') w.y += step;
      renderStage(); renderSelection(); syncPosFields(); saveLocal();
    }
  });

  // 拖动时防止选中文字
  document.addEventListener('selectstart', e => { if (drag) e.preventDefault(); });

  renderAll();

  // 调试用：?page=1 打开指定页面；?select=BTN_START 自动选中控件
  const pageParam = Number(params.get('page'));
  if (Number.isInteger(pageParam) && pageParam >= 0) switchPage(pageParam);
  const selParam = params.get('select');
  if (selParam) {
    const w = project.widgets.find(x => String(x.id || '') === selParam);
    if (w) select(w.uid);
  }
  if (params.has('preview')) enterPreview();
  if (params.has('previewcode')) {
    const b = project.widgets.find(w => w.type === 'button' && w.target);
    if (b) b.handler = 'saveSettings();';
  }
  if (params.has('previewclick')) {
    const b = project.widgets.find(w => w.type === 'button' && w.target);
    if (b) previewClick(b);
  }
  if (params.has('previewmenu')) {
    const mw = project.widgets.find(w => w.type === 'menu');
    if (mw) {
      previewMenuOpen[mw.uid] = true;
      renderStage();
      addPreviewLog(`伸缩菜单“${mw.text || '菜单'}” 展开`);
    }
  }
  if (params.has('previewinput')) {
    const iw = project.widgets.find(w => w.type === 'input');
    if (iw) {
      previewInputValues[iw.uid] = '你好，玩家';
      renderStage();
      const inp = document.querySelector('.w-input.preview-input input');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    }
  }

  // 测试用：?dumpjson=1 输出当前工程 JSON
  if (params.has('dumpjson')) {
    document.body.innerHTML = '<pre id="dumpjson">' + escHtml(JSON.stringify(serializeProject(), null, 2)) + '</pre>';
    return;
  }

  // 测试用：?selftest=1 跑一组核心交互断言
  if (params.has('selftest')) {
    const results = [];
    const ok = (name, cond) => results.push((cond ? 'PASS ' : 'FAIL ') + name);

    const np = normalizeProject({ designW: 800, designH: 600, widgets: [{ type: 'button', x: 123, y: 45, w: 100, h: 50, text: 'x' }] });
    ok('normalize 保留 x', np.widgets[0].x === 123 && np.widgets[0].w === 100);

    const code = generateCode(sampleProject());
    ok('生成 enum', code.includes('UI_MAIN_BTN_START'));
    ok('生成输入框光标', code.includes('placeCursor'));
    ok('每个按钮独立 hover 作用域', (code.match(/const bool hover/g) || []).length >= 3);
    ok('生成页面枚举', code.includes('UI_PAGE_SETTINGS'));
    ok('生成页面跳转', code.includes('goPage(UI_PAGE_SETTINGS)'));
    ok('比例布局 pctRect', code.includes('pctRect(vp'));
    ok('每个按钮独立回调', code.includes('onButton_MAIN_BTN_START()') && code.includes('onButtonClick'));
    const fixedCode = generateCode(Object.assign({}, sampleProject(), { layout: 'fixed' }));
    ok('固定布局不使用 pctRect', !fixedCode.includes('pctRect'));

    const beforeCount = project.widgets.length;
    addWidget('label');
    ok('添加控件', project.widgets.length === beforeCount + 1);

    const testW = project.widgets[project.widgets.length - 1];
    testW.centerH = true;
    testW.centerV = true;
    applyCentering(testW);
    ok('自动居中', testW.x === Math.round((project.designW - testW.w) / 2) &&
      testW.y === Math.round((project.designH - testW.h) / 2));

    const bgw = project.widgets.find(w => w.type === 'panel') || project.widgets.find(w => w.type === 'button');
    if (bgw) {
      bgw.bgPreviewData = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
      renderStage();
      ok('控件背景图渲染', !!document.querySelector('.widget-bg'));
    } else {
      ok('控件背景图渲染', false);
    }
    select(testW.uid);
    const el = document.querySelector('.widget[data-uid="' + testW.uid + '"]');
    if (el) {
      const r = el.getBoundingClientRect();
      const ox = testW.x;
      el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, clientX: r.left + 5, clientY: r.top + 5 }));
      window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: r.left + 45, clientY: r.top + 25 }));
      window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      ok('拖拽改变位置', project.widgets.find(w => w.uid === testW.uid).x !== ox);
    } else {
      ok('拖拽改变位置', false);
    }

    select(testW.uid);
    const sel = document.querySelector('.handle[data-dir="se"]');
    if (sel) {
      const r = sel.getBoundingClientRect();
      const ow = testW.w;
      sel.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, clientX: r.left + 4, clientY: r.top + 4 }));
      window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: r.left + 44, clientY: r.top + 24 }));
      window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      ok('缩放改变宽高', project.widgets.find(w => w.uid === testW.uid).w !== ow);
    } else {
      ok('缩放改变宽高', false);
    }

    const beforePages = project.pages.length;
    addPage();
    ok('新增页面', project.pages.length === beforePages + 1);
    switchPage(0);
    ok('切换页面', project.activePage === 0);

    ok('按钮逻辑检测', handlerCodeSnippet('// TODO\nint a = 1;') === 'int a = 1;');
    const targetBtn = project.widgets.find(w => w.type === 'button' && w.target);
    const beforePage = project.activePage;
    enterPreview();
    previewClick(targetBtn);
    ok('预览跳转生效', project.activePage !== beforePage);
    ok('预览日志有提示', $('#previewLog').textContent.includes('跳转'));

    switchPage(0, true);
    const codeBtn = project.widgets.find(w => w.type === 'button' && !w.target);
    codeBtn.handler = 'saveSettings();';
    previewClick(codeBtn);
    ok('预览其他逻辑提示', $('#previewLog').textContent.includes('其他逻辑'));

    exitPreview();
    ok('退出预览恢复页面', project.activePage === beforePage);

    enterPreview();
    switchPage(0, true);
    const inputW = project.widgets.find(w => w.type === 'input');
    const inp = document.querySelector('.w-input.preview-input input');
    ok('预览输入框存在', !!inp);
    if (inp) {
      inp.value = '123456789012345';
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      ok('预览输入框 maxLen', inp.value.length === 12);
      ok('预览输入框值记录', String(previewInputValues[inputW.uid] || '').length === 12);
    } else {
      ok('预览输入框 maxLen', false);
      ok('预览输入框值记录', false);
    }
    exitPreview();

    project.showGuides = true;
    project.guideCols = 5;
    project.guideRows = 4;
    renderStage();
    ok('等分线渲染', document.querySelectorAll('#guides .gv').length === 4 &&
      document.querySelectorAll('#guides .gh').length === 3);

    enterPreview();
    switchPage(1, true);
    const menuW = project.widgets.find(w => w.type === 'menu');
    const menuHeader = document.querySelector('.w-menu .menu-header');
    if (menuHeader) {
      menuHeader.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      ok('预览菜单展开', !!previewMenuOpen[menuW.uid] &&
        document.querySelectorAll('.w-menu .menu-item').length === menuW.items.length);
      const menuItem = document.querySelector('.w-menu .menu-item');
      menuItem.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      ok('预览菜单项日志', $('#previewLog').textContent.includes('菜单项'));
      ok('预览菜单项跳转', project.activePage === 0);
      const oldDir = menuW.expandDir;
      menuW.expandDir = 'fan';
      syncMenuHeight(menuW);
      fitMenuToStage(menuW);
      const fb = menuBounds(menuW);
      ok('扇形展开在画布内', fb.x >= 0 && fb.y >= 0 &&
        fb.x + fb.w <= project.designW + 1 && fb.y + fb.h <= project.designH + 1);
      menuW.expandDir = oldDir;
      syncMenuHeight(menuW);
    } else {
      ok('预览菜单展开', false);
      ok('预览菜单项日志', false);
    }
    exitPreview();

    const body = results.join('\n');
    document.body.innerHTML = '<pre id="selftest">' + escHtml(body) + '</pre>';
    return;
  }

  // 测试用：?dumpcode=1 只输出生成的代码，方便命令行验证
  if (params.has('dumpcode')) {
    const code = generateCode(project);
    document.body.innerHTML = '<pre id="dumpcode">' + escHtml(code) + '</pre>';
  }
}

init();
</script>
</body>
</html>
