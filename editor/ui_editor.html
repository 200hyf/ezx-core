<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ezx-core UI 编辑器</title>
<style>
  :root{
    --bg:#0e1117;
    --panel:#151922;
    --panel2:#1b202b;
    --line:#2a3142;
    --text:#dce5f5;
    --muted:#8d98ad;
    --accent:#4f8cff;
    --accent2:#6eaaff;
    --danger:#ff6b6b;
    --top:54px;
    --left:224px;
    --right:304px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.5 system-ui,"Microsoft YaHei","Segoe UI",sans-serif;
    overflow:hidden;
  }
  button{font:inherit;cursor:pointer}
  .topbar{
    height:var(--top); display:flex; align-items:center; gap:10px;
    padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line);
    position:relative; z-index:20;
  }
  .brand{font-weight:700; font-size:15px; white-space:nowrap}
  .brand span{color:var(--muted); font-weight:400; margin-left:6px; font-size:12px}
  .project-name{
    width:180px; margin-left:8px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:6px 9px; outline:none;
  }
  .project-name:focus{border-color:var(--accent)}
  .actions{display:flex; align-items:center; gap:6px; margin-left:auto}
  .btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; white-space:nowrap;
  }
  .btn:hover{border-color:#40506e; background:#222938}
  .btn:disabled{opacity:.4; cursor:default}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .btn.primary:hover{background:#3f7df0}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger)}
  .divider{width:1px; height:22px; background:var(--line); margin:0 4px}
  main{height:calc(100% - var(--top)); display:grid; grid-template-columns:var(--left) 1fr var(--right)}
  aside{background:var(--panel); overflow:auto; padding:12px}
  aside.left{border-right:1px solid var(--line)}
  aside.right{border-left:1px solid var(--line)}
  h3{margin:4px 0 8px; font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.4px}
  h3:not(:first-child){margin-top:18px}
  .palette{display:grid; grid-template-columns:1fr 1fr; gap:7px}
  .pal-btn{
    background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    padding:9px 6px; color:var(--text); text-align:center;
  }
  .pal-btn:hover{border-color:var(--accent); background:#1e2a40}
  .pal-btn b{display:block; font-size:18px; font-weight:400; line-height:1.2; color:var(--accent2)}
  .pal-btn small{color:var(--muted)}
  #layers{display:flex; flex-direction:column; gap:4px; margin-top:4px}
  .layer{
    display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:5px;
    border:1px solid transparent; background:var(--panel2); cursor:pointer;
  }
  .layer:hover{border-color:#3b4b68}
  .layer.selected{border-color:var(--accent); background:#1d2a42}
  .layer .ico{width:18px; text-align:center; color:var(--accent2)}
  .layer .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .layer .mini{
    background:transparent; border:0; color:var(--muted); padding:0 2px; font-size:12px;
  }
  .layer .mini:hover{color:var(--text)}
  .workspace{position:relative; overflow:hidden; display:flex; flex-direction:column}
  .page-tabs{
    height:34px; flex:none; display:flex; align-items:center; gap:4px;
    padding:0 10px; background:var(--panel); border-bottom:1px solid var(--line);
    overflow-x:auto; overflow-y:hidden;
  }
  .page-tab{
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:transparent; color:var(--muted); border:1px solid transparent;
    border-radius:5px; padding:4px 9px; font-size:12px;
  }
  .page-tab:hover{background:var(--panel2); color:var(--text)}
  .page-tab.active{background:#1d2a42; border-color:var(--accent); color:var(--text)}
  .page-tab .x{opacity:.55; padding:0 1px}
  .page-tab .x:hover{opacity:1; color:var(--danger)}
  .page-tab.add{color:var(--accent2); border:1px dashed #3b4b68}
  #stageWrap{flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:24px}
  #stageHolder{position:relative; flex:none}
  #stage{
    position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden;
    box-shadow:0 18px 60px rgba(0,0,0,.55); background:#12141c;
  }
  #stageBg{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:none; pointer-events:none;
  }
  #grid{position:absolute; inset:0; pointer-events:none; opacity:.7}
  #guides{position:absolute; inset:0; pointer-events:none; display:none; z-index:1}
  #guides .gv{position:absolute; top:0; bottom:0; width:1px; background:rgba(255,183,77,.45)}
  #guides .gh{position:absolute; left:0; right:0; height:1px; background:rgba(255,183,77,.45)}
  #widgets{position:absolute; inset:0}
  .widget{position:absolute; user-select:none; cursor:move; overflow:hidden}
  .widget-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; z-index:0}
  .widget > *:not(.widget-bg){position:relative; z-index:1}
  .widget.hidden{display:none}
  .widget.disabled{opacity:.65}
  .w-button{display:flex; align-items:center; justify-content:center; text-align:center; white-space:pre-wrap}
  .w-label{display:flex; align-items:center; white-space:pre-wrap; overflow:hidden}
  .w-panel{}
  .w-image{display:flex; align-items:center; justify-content:center; background:#0b0e14; color:#5b6b86; overflow:hidden}
  .w-image img{width:100%; height:100%; display:block}
  .w-input{display:flex; align-items:center; overflow:hidden; white-space:nowrap}
  .w-menu{background:transparent !important}
  .menu-header,.menu-item{
    display:flex; align-items:center; width:100%; box-sizing:border-box;
    padding:0 14px; white-space:nowrap; overflow:hidden; cursor:pointer;
  }
  .menu-header{justify-content:space-between}
  .menu-item{padding-left:26px}
  .w-input .ph{opacity:.65}
  .w-input.preview-input input::placeholder{color:var(--ph); opacity:1}
  #selection{position:absolute; pointer-events:none; z-index:99; display:none}
  #selection.show{display:block}
  #selection .box{position:absolute; inset:0; border:1.5px dashed var(--accent2); box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  .handle{
    position:absolute; width:9px; height:9px; margin:-5px 0 0 -5px; background:#fff;
    border:1px solid var(--accent); border-radius:2px; pointer-events:auto; z-index:100;
  }
  .handle[data-dir="nw"]{left:0;top:0;cursor:nwse-resize}
  .handle[data-dir="n"]{left:50%;top:0;cursor:ns-resize}
  .handle[data-dir="ne"]{left:100%;top:0;cursor:nesw-resize}
  .handle[data-dir="e"]{left:100%;top:50%;cursor:ew-resize}
  .handle[data-dir="se"]{left:100%;top:100%;cursor:nwse-resize}
  .handle[data-dir="s"]{left:50%;top:100%;cursor:ns-resize}
  .handle[data-dir="sw"]{left:0;top:100%;cursor:nesw-resize}
  .handle[data-dir="w"]{left:0;top:50%;cursor:ew-resize}
  .statusbar{
    height:34px; border-top:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:14px; padding:0 12px; color:var(--muted); font-size:12px;
  }
  .statusbar label{display:flex; align-items:center; gap:5px; cursor:pointer}
  .statusbar select{background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 4px}
  .statusbar .right{margin-left:auto}
  #props{font-size:12px}
  .field{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .field label{width:78px; color:var(--muted); flex:none}
  .field input[type=text],.field input[type=number],.field select,.field textarea{
    flex:1; min-width:0; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); border-radius:5px; padding:5px 7px; outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field input[type=color]{
    width:36px; height:26px; padding:1px; background:var(--panel2);
    border:1px solid var(--line); border-radius:4px;
  }
  .field textarea{height:82px; resize:vertical; font-family:Consolas,"Courier New",monospace; font-size:12px}
  .field .chk{flex:1; display:flex; gap:12px; align-items:center}
  .field .chk label{width:auto; display:flex; align-items:center; gap:4px; color:var(--text); cursor:pointer}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .row2 .field{display:block; margin-bottom:0}
  .row2 .field label{display:block; width:auto; margin-bottom:3px}
  .row2 .field input{width:100%}
  .hint{color:var(--muted); font-size:11px; line-height:1.5; margin:6px 0 10px}
  .menu-item-card{border:1px solid var(--line); border-radius:7px; padding:7px; margin-bottom:8px; background:#121722}
  .mi-top{display:flex; align-items:center; gap:4px; margin-bottom:5px}
  .mi-no{color:var(--muted); font-size:11px; margin-right:auto}
  .mi-top .mini{background:transparent;border:0;color:var(--muted);cursor:pointer}
  .mi-top .mini:hover{color:var(--text)}
  .menu-item-card input[type=text],.menu-item-card select,.menu-item-card textarea{
    width:100%; box-sizing:border-box; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); border-radius:4px; padding:4px 6px; margin-bottom:5px; outline:none;
  }
  .menu-item-card textarea{height:46px; resize:vertical; font-family:Consolas,monospace; font-size:11px}
  .mi-colors{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin-bottom:5px}
  .mi-colors label{font-size:10px; color:var(--muted); display:flex; flex-direction:column; gap:2px}
  .mi-colors input[type=color]{width:100%; height:22px; padding:0; border:1px solid var(--line); background:var(--panel2); border-radius:3px}
  .mi-row{display:flex; gap:10px; align-items:center; margin-bottom:5px; font-size:11px; color:var(--muted)}
  .mi-row input[type=number]{width:58px; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:3px}
  .mi-chk{display:flex; align-items:center; gap:4px; color:var(--text)}
  .type-title{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:14px; font-weight:600}
  .badge{background:#22304a; color:var(--accent2); border-radius:4px; padding:1px 6px; font-size:11px}
  .actions-row{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0}
  .actions-row .btn{padding:5px 8px; font-size:12px}
  .empty{color:var(--muted); padding:10px 0; line-height:1.8}
  .modal{
    position:fixed; inset:0; background:rgba(4,7,12,.78); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .modal.hidden{display:none}
  .modal-card{
    width:min(1080px,96vw); height:min(820px,92vh); background:var(--panel);
    border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column;
    box-shadow:0 30px 90px rgba(0,0,0,.6);
  }
  .modal-head{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0; font-size:15px}
  .modal-head .actions{margin-left:auto; display:flex; gap:6px}
  .modal-body{flex:1; overflow:auto; padding:12px 16px; background:#0b0e14}
  #codeOut{
    margin:0; white-space:pre; font:12px/1.55 Consolas,"Courier New",monospace;
    color:#cfe0ff; tab-size:4;
  }
  #toast{
    position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(12px);
    background:#24314a; border:1px solid #3e5478; color:#e8f0ff; padding:8px 14px;
    border-radius:6px; opacity:0; pointer-events:none; transition:.2s; z-index:300;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  body.preview .topbar,body.preview aside,body.preview .statusbar,body.preview .page-tabs{display:none}
  body.preview main{height:100%; grid-template-columns:1fr}
  body.preview #stageWrap{padding:0}
  body.preview #grid,body.preview #guides{display:none}
  #previewExit{
    position:fixed; right:16px; top:16px; z-index:400; display:none;
    background:rgba(20,26,38,.9); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:7px 12px;
  }
  body.preview #previewExit{display:block}
  body.preview .widget{cursor:default}
  body.preview .w-button{cursor:pointer}
  #previewLog{
    position:fixed; left:16px; bottom:16px; z-index:400; display:none;
    width:min(560px,80vw); max-height:170px; overflow:auto;
    background:rgba(14,19,29,.92); border:1px solid #3a4a6a; border-radius:8px;
    padding:8px 10px; color:#cfe0ff; font:12px/1.55 Consolas,"Microsoft YaHei",monospace;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  body.preview #previewLog{display:block}
  #previewLog .plog{padding:2px 0; border-bottom:1px solid rgba(255,255,255,.05)}
  #previewLog .plog:last-child{border-bottom:0}
  @media (max-width:1100px){
    :root{--left:190px;--right:270px}
    .project-name{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">ezx-core <span>UI 编辑器</span></div>
  <input id="projectName" class="project-name" placeholder="项目名">
  <div class="actions">
    <button class="btn" id="btnNew">新建</button>
    <button class="btn" id="btnSample">示例</button>
    <button class="btn" id="btnOpen">打开</button>
    <button class="btn" id="btnSave">保存</button>
    <span class="divider"></span>
    <button class="btn" id="btnUndo" title="Ctrl+Z">撤销</button>
    <button class="btn" id="btnRedo" title="Ctrl+Y">重做</button>
    <span class="divider"></span>
    <button class="btn" id="btnPreview">预览</button>
    <button class="btn primary" id="btnCode">生成代码</button>
  </div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
</header>

<main>
  <aside class="left">
    <h3>添加控件</h3>
    <div class="palette">
      <button class="pal-btn" data-add="button"><b>▭</b><small>按钮</small></button>
      <button class="pal-btn" data-add="label"><b>T</b><small>文字</small></button>
      <button class="pal-btn" data-add="panel"><b>▦</b><small>面板</small></button>
      <button class="pal-btn" data-add="image"><b>◫</b><small>图片</small></button>
      <button class="pal-btn" data-add="input"><b>⌨</b><small>文本输入</small></button>
      <button class="pal-btn" data-add="menu"><b>☰</b><small>伸缩菜单</small></button>
    </div>
    <h3>图层 <span id="layerCount" style="color:var(--muted)"></span></h3>
    <div id="layers"></div>
  </aside>

  <section class="workspace">
    <div id="pageTabs" class="page-tabs"></div>
    <div id="stageWrap">
      <div id="stageHolder">
        <div id="stage">
          <img id="stageBg" alt="">
          <div id="grid"></div>
          <div id="guides"></div>
          <div id="widgets"></div>
          <div id="selection">
            <div class="box"></div>
            <div class="handle" data-dir="nw"></div>
            <div class="handle" data-dir="n"></div>
            <div class="handle" data-dir="ne"></div>
            <div class="handle" data-dir="e"></div>
            <div class="handle" data-dir="se"></div>
            <div class="handle" data-dir="s"></div>
            <div class="handle" data-dir="sw"></div>
            <div class="handle" data-dir="w"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="statusbar">
      <label><input type="checkbox" id="snapChk" checked> 网格吸附</label>
      <span>网格 <b id="gridSize">8</b> px</span>
      <span>等分 列 <input type="number" id="guideCols" min="1" max="64" value="4" style="width:46px"></span>
      <span>行 <input type="number" id="guideRows" min="1" max="64" value="3" style="width:46px"></span>
      <label><input type="checkbox" id="guideChk"> 等分线</label>
      <label><input type="checkbox" id="guideSnapChk" checked> 吸附等分线</label>
      <span>缩放
        <select id="zoomSel">
          <option value="fit">适应</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
        </select>
      </span>
      <span id="selInfo" class="right">未选中</span>
    </div>
  </section>

  <aside class="right">
    <h3>属性</h3>
    <div id="props"></div>
  </aside>
</main>

<button id="previewExit">退出预览 (Esc)</button>
<div id="previewLog"></div>

<div id="codeModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>生成的 C++ 代码</h2>
      <span class="hint" style="margin:0">保存为 ui_generated.cpp，加到工程里</span>
      <div class="actions">
        <button class="btn" id="btnCopy">复制</button>
        <button class="btn" id="btnDownload">下载 .cpp</button>
        <button class="btn" id="btnCloseModal">关闭</button>
      </div>
    </div>
    <div class="modal-body"><pre id="codeOut"></pre></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================================
   ezx-core UI 编辑器
   - 数据模型：project.widgets[]
   - 输出：ui_generated.cpp（调用 ui::init / ui::update / ui::draw）
   ========================================================================= */
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const W_DEFAULT = 1280, H_DEFAULT = 720;
const LS_KEY = 'ezx-ui-editor-v1';

let project = null;
let selectedUid = null;
let zoom = 1;
let zoomMode = 'fit';
let snap = true;
let drag = null;
let undoStack = [];
let redoStack = [];
let lastHistoryAt = 0;
let generatedCode = '';
let uidSeq = 1;
let previewReturnPage = -1;
let previewInputValues = {};
let previewMenuOpen = {};

/* ------------------------------- 工具 ------------------------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d = 0) => {
  const n = Number(v);
  return Number.isFinite(n) ? n : d;
};
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const uid = () => 'w' + (uidSeq++);
const deep = o => JSON.parse(JSON.stringify(o));

function toast(msg, ms = 1800) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

function hexToRgb(hex) {
  let s = String(hex || '').trim();
  if (!s.startsWith('#')) s = '#' + s;
  const m = /^#([0-9a-f]{6})$/i.exec(s);
  if (!m) return [255, 255, 255];
  const v = parseInt(m[1], 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function rgbExpr(hex) {
  const [r, g, b] = hexToRgb(hex);
  return `RGB(${r}, ${g}, ${b})`;
}
function cppString(s) {
  return '"' + String(s ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\r/g, '')
    .replace(/\n/g, '\\n') + '"';
}
function cppIdent(s, fallback) {
  let x = String(s || '').trim().replace(/[^A-Za-z0-9_]/g, '_');
  if (!x || !/^[A-Za-z_]/.test(x)) x = fallback;
  return x;
}
function buttonFuncName(w) {
  const prefix = project && project.pages.length > 1
    ? cppIdent(project.pages[project.activePage].id, 'PAGE') + '_'
    : '';
  return 'onButton_' + prefix + cppIdent(w.id, 'BTN_1');
}
function alignExpr(a) {
  return a === 'left' ? 'Align::Left' : a === 'right' ? 'Align::Right' : 'Align::Center';
}

/* ------------------------------- 数据 ------------------------------- */
const TYPE_LABEL = { button: '按钮', label: '文字', panel: '面板', image: '图片', input: '文本输入', menu: '伸缩菜单' };
const TYPE_ICON = { button: '▭', label: 'T', panel: '▦', image: '◫', input: '⌨', menu: '☰' };

function defaults(type) {
  const base = {
    uid: uid(), type, id: '', x: 0, y: 0, w: 200, h: 60,
    visible: true, enabled: true, centerH: false, centerV: false
  };
  if (type === 'button') return Object.assign(base, {
    w: 280, h: 64, text: '按钮', fontSize: 28,
    textColor: '#eef2ff', normalBg: '#222a3e', hoverBg: '#3e5684',
    borderColor: '#5c7cc4', borderWidth: 2, radius: 8,
    disabledBg: '#262a33', disabledText: '#777d8a',
    iconPath: '', iconSize: 40, iconGap: 10, iconPos: 'left', iconPreviewData: '',
    bgImage: '', bgPreviewData: '',
    target: '',
    handler: '// TODO: 在这里写点击逻辑'
  });
  if (type === 'label') return Object.assign(base, {
    w: 300, h: 44, text: '文字', fontSize: 28, color: '#e8eefc', align: 'center'
  });
  if (type === 'panel') return Object.assign(base, {
    w: 360, h: 220, fillColor: '#1a2030',

function makeWidget(type, x, y) {
  const w = defaults(type);
  w.x = Math.round(x);
  w.y = Math.round(y);
  if (type === 'button') w.id = uniqueId('BTN');
  if (type === 'input') w.id = uniqueId('INPUT');
  if (type === 'menu') {
    w.id = uniqueId('MENU');
    w.h = w.headerHeight + w.items.length * w.itemHeight;
  }
  return w;
}

function uniqueId(prefix) {
  const used = new Set(project ? project.widgets.map(w => String(w.id || '').toUpperCase()) : []);
  let i = 1;
  while (used.has((prefix + '_' + i).toUpperCase())) i++;
  return prefix + '_' + i;
}

function normalizeWidgets(list) {
  const arr = Array.isArray(list) ? list : [];
  const seen = new Set();
  arr.forEach((w, i) => {
    const d = defaults(w.type || 'button');
    const merged = Object.assign({}, d, w);
    Object.assign(w, merged);
    while (!w.uid || seen.has(w.uid)) w.uid = uid();
    seen.add(w.uid);
    w.x = Math.round(num(w.x));
    w.y = Math.round(num(w.y));
    w.w = Math.max(8, Math.round(num(w.w, 100)));
    w.h = Math.max(8, Math.round(num(w.h, 40)));
    if (w.type === 'button' && !w.id) w.id = 'BTN_' + (i + 1);
    if (w.type === 'input' && !w.id) w.id = 'INPUT_' + (i + 1);
    if (w.type === 'menu') {
      if (!w.id) w.id = 'MENU_' + (i + 1);
      w.items = (Array.isArray(w.items) ? w.items : []).map((it, ii) => {
        if (typeof it === 'string') it = { text: it };
        return {
          text: String(it.text || ('菜单项 ' + (ii + 1))),
          target: String(it.target || ''),
          itemBg: String(it.itemBg || ''),
          itemHoverBg: String(it.itemHoverBg || ''),
          textColor: String(it.textColor || ''),
          fontSize: Math.max(0, Math.round(num(it.fontSize, 0))),
          enabled: it.enabled !== false,
          handler: String(it.handler || '')
        };
      });
      w.headerHeight = clamp(Math.round(num(w.headerHeight, 52)), 24, 200);
      w.itemHeight = clamp(Math.round(num(w.itemHeight, 44)), 20, 160);
      w.expandDir = ['down', 'up', 'left', 'right', 'fan'].includes(w.expandDir) ? w.expandDir : 'down';
      w.trigger = w.trigger === 'hover' ? 'hover' : 'click';
      w.closeOnSelect = w.closeOnSelect !== false;
      w.closeOnOutside = w.closeOnOutside !== false;
      w.fanRadius = clamp(Math.round(num(w.fanRadius, 180)), 40, 900);
      w.fanStart = Math.round(num(w.fanStart, 200));
      w.fanEnd = Math.round(num(w.fanEnd, 340));
      w.h = menuHeight(w);
    }
  });
  return arr;
}

function normalizeProject(p) {
  const out = Object.assign({
    version: 1, name: '未命名界面',
    designW: W_DEFAULT, designH: H_DEFAULT,
    bg: '#12141c', bgImage: '', bgFit: 'cover', bgPreviewData: '',
    layout: 'percent', grid: 8, guideCols: 4, guideRows: 3, showGuides: false, snapGuides: true,
    pages: null, activePage: 0, widgets: []
  }, p || {});
  out.designW = clamp(num(out.designW, W_DEFAULT), 320, 3840);
  out.designH = clamp(num(out.designH, H_DEFAULT), 240, 2160);
  out.grid = clamp(num(out.grid, 8), 2, 64);
  out.guideCols = clamp(Math.round(num(out.guideCols, 4)), 1, 64);
  out.guideRows = clamp(Math.round(num(out.guideRows, 3)), 1, 64);
  out.showGuides = !!out.showGuides;
  out.snapGuides = out.snapGuides !== false;

  let pages = Array.isArray(out.pages) && out.pages.length ? out.pages : null;
  if (!pages) {
    pages = [{ key: 'p1', id: 'MAIN', name: '主页面', widgets: Array.isArray(out.widgets) ? out.widgets : [] }];
  }
  const seenKeys = new Set();
  pages = pages.map((pg, i) => {
    let key = String(pg.key || ('p' + (i + 1)));
    let n = 2;
    while (seenKeys.has(key)) key = 'p' + (i + 1) + '_' + (n++);
    seenKeys.add(key);
    return {
      key,
      id: String(pg.id || ('PAGE_' + (i + 1))).trim() || ('PAGE_' + (i + 1)),
      name: String(pg.name || ('页面 ' + (i + 1))).trim() || ('页面 ' + (i + 1)),
      widgets: normalizeWidgets(pg.widgets)
    };
  });
  out.pages = pages;
  out.activePage = clamp(Math.round(num(out.activePage, 0)), 0, pages.length - 1);
  out.widgets = pages[out.activePage].widgets;
  out.bgFit = ['cover', 'fit', 'stretch'].includes(out.bgFit) ? out.bgFit : 'cover';
  out.layout = out.layout === 'fixed' ? 'fixed' : 'percent';
  return out;
}

/* ------------------------------- 历史 ------------------------------- */
function historyPush() {
  const now = Date.now();
  if (now - lastHistoryAt < 450) return;
  lastHistoryAt = now;
  undoStack.push(JSON.stringify(project));
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}
function historyForce() {
  undoStack.push(JSON.stringify(project));
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(project));
  project = normalizeProject(JSON.parse(undoStack.pop()));
  selectedUid = null;
  renderAll();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(project));
  project = normalizeProject(JSON.parse(redoStack.pop()));
  selectedUid = null;
  renderAll();
}

/* ------------------------------- 保存 ------------------------------- */
function serializeProject() {
  const p = deep(project);
  (p.pages || []).forEach(pg => {
    (pg.widgets || []).forEach(w => { delete w.previewData; delete w.iconPreviewData; delete w.bgPreviewData; });
  });
  delete p.widgets;
  delete p.bgPreviewData;
  return p;
}
let saveTimer = null;
function saveLocal() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(serializeProject()));
    } catch (e) { /* 忽略 quota 错误 */ }
  }, 250);
}
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 200);
}

function selected() {

function select(uidValue) {

/* ------------------------------- 页面 ------------------------------- */
function syncPageWidgets() {
  if (project.pages[project.activePage]) {
    project.pages[project.activePage].widgets = project.widgets;
  }
}
function renderPageTabs() {
  const box = $('#pageTabs');
  if (!box) return;
  box.innerHTML = '';
  project.pages.forEach((pg, i) => {
    const tab = document.createElement('button');
    tab.className = 'page-tab' + (i === project.activePage ? ' active' : '');
    tab.dataset.index = i;
    tab.title = '双击重命名；C++ 页面 ID: ' + pg.id;
    tab.innerHTML = `<span>${escHtml(pg.name)}</span>` +
      (project.pages.length > 1 ? `<span class="x" data-close="${i}" title="删除页面">×</span>` : '');
    box.appendChild(tab);
  });
  const add = document.createElement('button');
  add.className = 'page-tab add';
  add.textContent = '+ 页面';
  add.addEventListener('click', addPage);
  box.appendChild(add);
}
function switchPage(i, silent) {
  i = clamp(Math.round(i), 0, project.pages.length - 1);
  if (i === project.activePage) return;
  syncPageWidgets();
  project.activePage = i;
  project.widgets = project.pages[i].widgets;
  selectedUid = null;
  renderAll();
  if (!silent) toast('切换到：' + project.pages[i].name);
}
function addPage() {
  syncPageWidgets();
  let n = project.pages.length + 1;
  let key = 'p' + n;
  while (project.pages.some(p => p.key === key)) key = 'p' + (n++) + '_x';
  let id = 'PAGE_' + n;
  while (project.pages.some(p => p.id === id)) id = 'PAGE_' + (n++);
  const pg = { key, id, name: '页面 ' + n, widgets: [] };
  project.pages.push(pg);
  project.activePage = project.pages.length - 1;
  project.widgets = pg.widgets;
  selectedUid = null;
  renderAll();
  toast('新增页面：' + pg.name);
}
function deletePage(i) {
  if (project.pages.length <= 1) { toast('至少保留一个页面'); return; }
  const pg = project.pages[i];
  if (!confirm('删除页面「' + pg.name + '」？上面的控件会一起删除。')) return;
  syncPageWidgets();
  project.pages.splice(i, 1);
  project.pages.forEach(p => p.widgets.forEach(w => {
    if (w.target === pg.key) w.target = '';
    if (w.type === 'menu' && Array.isArray(w.items)) {
      w.items.forEach(it => { if (it.target === pg.key) it.target = ''; });
    }
  }));
  project.activePage = clamp(project.activePage, 0, project.pages.length - 1);
  project.widgets = project.pages[project.activePage].widgets;
  selectedUid = null;
  renderAll();
}
function renamePage(i) {
  const pg = project.pages[i];

  const name = prompt('页面名称：', pg.name);
  if (name === null) return;
  pg.name = String(name).trim() || pg.name;
  renderPageTabs();
  renderProps();
  saveLocal();
}

/* ------------------------------- 预览 ------------------------------- */
function handlerCodeSnippet(s) {
  const lines = String(s || '').split(/\r?\n/);
  let inBlock = false;
  for (const raw of lines) {
    const t = raw.trim();
    if (!t) continue;
    if (inBlock) {
      if (t.includes('*/')) inBlock = false;
      continue;
    }
    if (t.startsWith('/*')) {
      if (!t.includes('*/')) inBlock = true;
      continue;
    }
    if (t.startsWith('//')) continue;
    if (t.startsWith('*')) continue;
    return t.length > 80 ? t.slice(0, 77) + '…' : t;
  }
  return '';
}
function addPreviewLog(text) {
  const box = $('#previewLog');
  if (!box) return;
  const line = document.createElement('div');
  line.className = 'plog';
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  line.textContent = `[${hh}:${mm}:${ss}] ${text}`;
  box.appendChild(line);
  while (box.children.length > 8) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
function enterPreview() {
  previewReturnPage = project.activePage;
  previewInputValues = {};
  previewMenuOpen = {};
  document.body.classList.add('preview');
  const box = $('#previewLog');
  if (box) box.innerHTML = '';
  addPreviewLog('预览模式：按钮可跳转，文本输入框可点击输入；Esc 退出');
  renderStage();
  renderSelection();
  setTimeout(fitIfNeeded, 0);
}
function exitPreview() {
  document.body.classList.remove('preview');
  previewInputValues = {};
  previewMenuOpen = {};
  const box = $('#previewLog');
  if (box) box.innerHTML = '';
  if (previewReturnPage >= 0 && previewReturnPage !== project.activePage) {
    switchPage(previewReturnPage, true);
  } else {
    renderStage();
  }
  previewReturnPage = -1;
  renderSelection();
  setTimeout(fitIfNeeded, 0);
}
function closePreviewMenus(exceptUid) {
  let changed = false;
  project.widgets.forEach(m => {
    if (m.type === 'menu' && m.uid !== exceptUid && m.closeOnOutside && previewMenuOpen[m.uid]) {
      previewMenuOpen[m.uid] = false;
      changed = true;
    }
  });
  if (changed) renderStage();
}

function previewClick(w) {
  const btnText = String(w.text || w.id || '按钮');
  const code = handlerCodeSnippet(w.handler);
  let targetIndex = -1;
  let targetName = '';
  if (w.target) {
    targetIndex = project.pages.findIndex(pg => pg.key === w.target);
    if (targetIndex >= 0) targetName = project.pages[targetIndex].name;
  }

  if (targetIndex >= 0 && code) {
    addPreviewLog(`按钮“${btnText}” → 跳转“${targetName}”；其他逻辑：${code}`);
    switchPage(targetIndex, true);
    toast(`跳转“${targetName}”，还会执行其他逻辑（见左下角）`, 2600);
  } else if (targetIndex >= 0) {
    addPreviewLog(`按钮“${btnText}” → 跳转“${targetName}”`);
    switchPage(targetIndex, true);
    toast(`跳转：${targetName}`, 1800);
  } else if (code) {
    addPreviewLog(`按钮“${btnText}” → 其他逻辑：${code}`);
    toast('会执行其他逻辑（见左下角预览日志）', 2400);
  } else {
    addPreviewLog(`按钮“${btnText}” → 没有绑定页面跳转或其他逻辑`);
    toast('这个按钮没有绑定页面跳转或其他逻辑', 2000);
  }
}

/* ------------------------------- 渲染舞台 ------------------------------- */
function gridCss(size) {

function prependWidgetBg(el, w) {

function renderStage() {

  stage.style.height = project.designH + 'px';

  const bg = $('#stageBg');

    bg.src = project.bgPreviewData;
    bg.style.display = 'block';
    bg.style.objectFit = project.bgFit === 'cover' ? 'cover' : project.bgFit === 'stretch' ? 'fill' : 'contain';
  } else {
    bg.removeAttribute('src');
    bg.style.display = 'none';
  }
  const grid = $('#grid');
  grid.style.backgroundImage = gridCss(project.grid);
  grid.style.backgroundSize = `${project.grid}px ${project.grid}px`;
  renderGuides();

  const box = $('#widgets');
  box.innerHTML = '';
  project.widgets.forEach(w => {
    const el = document.createElement('div');
    el.className = 'widget w-' + w.type + (w.visible === false ? ' hidden' : '') + (w.enabled === false ? ' disabled' : '');
    el.dataset.uid = w.uid;
    Object.assign(el.style, {
      left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px',
      borderRadius: (w.radius || 0) + 'px'
    });
    if (w.borderWidth && w.type !== 'menu') {
      el.style.border = `${w.borderWidth}px solid ${w.borderColor || '#555'}`;
    }
    if (w.type === 'button') {
      el.style.background = w.normalBg || '#222a3e';
      el.style.color = w.textColor || '#fff';
      el.style.fontSize = (w.fontSize || 28) + 'px';
      const hasIcon = String(w.iconPath || '').trim() !== '' || w.iconPreviewData;
      if (hasIcon) {
        el.style.flexDirection = w.iconPos === 'top' ? 'column' : 'row';
        el.style.gap = Math.max(0, Math.round(num(w.iconGap, 10))) + 'px';
        const icon = document.createElement('span');
        icon.style.cssText = 'flex:none;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;';
        icon.style.width = Math.max(8, Math.round(num(w.iconSize, 40))) + 'px';
        icon.style.height = icon.style.width;
        if (w.iconPreviewData) {
          const img = document.createElement('img');
          img.src = w.iconPreviewData;
          img.alt = '';
          img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block';
          icon.appendChild(img);
        } else {
          icon.textContent = '🖼';
          icon.style.fontSize = '14px';
          icon.style.color = '#8fa6c8';
          icon.style.border = '1px dashed #4a5a7a';
          icon.style.borderRadius = '4px';
        }
        const txt = document.createElement('span');
        txt.textContent = w.text || '';
        if (w.iconPos === 'right') { el.appendChild(txt); el.appendChild(icon); }
        else { el.appendChild(icon); el.appendChild(txt); }
      } else {
        el.textContent = w.text || '';
      }
      prependWidgetBg(el, w);
      if (w.enabled !== false) {
        el.addEventListener('mouseenter', () => { el.style.background = w.hoverBg || w.normalBg; });
        el.addEventListener('mouseleave', () => { el.style.background = w.normalBg || '#222a3e'; });
      }
    } else if (w.type === 'label') {
      el.style.color = w.color || '#fff';
      el.style.fontSize = (w.fontSize || 28) + 'px';
      el.textContent = w.text || '';
      el.style.justifyContent = w.align === 'left' ? 'flex-start' : w.align === 'right' ? 'flex-end' : 'center';
      el.style.textAlign = w.align || 'center';
    } else if (w.type === 'panel') {
      el.style.background = w.fillColor || '#1a2030';
      prependWidgetBg(el, w);
    } else if (w.type === 'image') {
      if (w.previewData) {
        const img = document.createElement('img');
        img.src = w.previewData;
        img.alt = '';
        img.style.objectFit = w.fit === 'cover' ? 'cover' : w.fit === 'stretch' ? 'fill' : 'contain';
        el.appendChild(img);
      } else {
        el.textContent = w.path ? ('🖼 ' + w.path) : '图片';
        el.style.fontSize = '12px';
        el.style.padding = '6px';
        el.style.textAlign = 'center';
      }
    } else if (w.type === 'menu') {
      el.style.background = 'transparent';
      el.style.overflow = 'visible';
      const vertical = w.expandDir === 'down' || w.expandDir === 'up';
      el.style.display = vertical ? 'flex' : 'block';
      el.style.flexDirection = 'column';
      el.style.justifyContent = w.expandDir === 'up' ? 'flex-end' : 'flex-start';
      const isPreview = document.body.classList.contains('preview');
      if (isPreview && !(w.uid in previewMenuOpen)) previewMenuOpen[w.uid] = !!w.defaultOpen;
      const open = isPreview ? !!previewMenuOpen[w.uid] : true;

      const header = document.createElement('div');
      header.className = 'menu-header';
      header.dataset.menuPart = 'header';
      if (!vertical) {
        header.style.position = 'absolute';
        header.style.left = '0';
        header.style.top = '0';
        header.style.right = '0';
      }
      header.style.height = (w.headerHeight || 52) + 'px';
      header.style.background = w.headerBg || '#222a3e';
      header.style.border = (w.borderWidth || 0) + 'px solid ' + (w.borderColor || '#5c7cc4');
      header.style.borderRadius = (w.radius || 0) + 'px';
      header.style.color = w.textColor || '#eef2ff';
      header.style.fontSize = (w.fontSize || 26) + 'px';
      const title = document.createElement('span');
      title.textContent = w.text || '菜单';
      const arrow = document.createElement('span');
      arrow.textContent = open ? '▴' : '▾';
      arrow.style.opacity = '.75';
      header.appendChild(title);
      header.appendChild(arrow);
      header.addEventListener('mouseenter', () => {
        header.style.background = w.headerHoverBg || w.headerBg;
        if (isPreview && w.trigger === 'hover' && !previewMenuOpen[w.uid]) {
          previewMenuOpen[w.uid] = true;
          renderStage();
        }
      });
      header.addEventListener('mouseleave', () => { header.style.background = w.headerBg || '#222a3e'; });

      const makeItem = (it, i) => {
        const item = document.createElement('div');
        item.className = 'menu-item';
        item.dataset.menuPart = 'item';
        item.dataset.index = i;
        if (!vertical) {
          const pos = menuItemPos(w, i);
          item.style.position = 'absolute';
          item.style.left = (pos.x - w.x) + 'px';
          item.style.top = (pos.y - w.y) + 'px';
          item.style.width = w.w + 'px';
        }
        item.style.height = (w.itemHeight || 44) + 'px';
        item.style.background = it.itemBg || w.itemBg || '#1a2030';
        item.style.border = (w.borderWidth || 0) + 'px solid ' + (w.borderColor || '#5c7cc4');
        item.style.borderRadius = (w.radius || 0) + 'px';
        item.style.color = it.textColor || w.textColor || '#eef2ff';
        item.style.fontSize = (it.fontSize > 0 ? it.fontSize : (w.itemFontSize || 24)) + 'px';
        item.style.opacity = it.enabled === false ? '.55' : '1';
        item.textContent = it.text || '';
        const hoverBg = it.itemHoverBg || w.itemHoverBg || it.itemBg || w.itemBg;
        item.addEventListener('mouseenter', () => { item.style.background = hoverBg; });
        item.addEventListener('mouseleave', () => { item.style.background = it.itemBg || w.itemBg || '#1a2030'; });
        return item;
      };

      if (w.expandDir === 'up') {
        if (open) (w.items || []).forEach((it, i) => el.appendChild(makeItem(it, i)));
        el.appendChild(header);
      } else {
        el.appendChild(header);
        if (open) (w.items || []).forEach((it, i) => el.appendChild(makeItem(it, i)));
      }

      if (isPreview && w.trigger === 'hover' && w.closeOnOutside) {
        el.addEventListener('mouseleave', () => {
          if (previewMenuOpen[w.uid]) {
            previewMenuOpen[w.uid] = false;
            renderStage();
          }
        });
      }
    } else if (w.type === 'input') {
      el.style.background = w.inputBg || '#181e2c';
      el.style.fontSize = (w.fontSize || 24) + 'px';
      prependWidgetBg(el, w);
      if (document.body.classList.contains('preview')) {
        el.classList.add('preview-input');
        el.style.padding = '0';
        el.style.setProperty('--ph', w.placeholderColor || '#7c8aa5');
        let val = Object.prototype.hasOwnProperty.call(previewInputValues, w.uid)
          ? String(previewInputValues[w.uid])
          : String(w.value || '');
        if (w.digitsOnly) val = val.replace(/\D/g, '');
        const maxLen = Math.max(0, Math.round(num(w.maxLen, 16)));
        if (maxLen > 0) val = val.slice(0, maxLen);
        previewInputValues[w.uid] = val;
        el.style.borderColor = w.borderColor || '#4a5a7a';

        const inp = document.createElement('input');
        inp.type = w.password ? 'password' : 'text';
        inp.value = val;
        inp.placeholder = w.placeholder || '';
        inp.maxLength = maxLen > 0 ? maxLen : 524288;
        inp.autocomplete = 'off';
        inp.spellcheck = false;
        inp.style.cssText = 'width:100%;height:100%;box-sizing:border-box;border:0;outline:0;'
          + 'background:transparent;font-family:inherit;line-height:normal;padding:0 12px;'
          + 'font-size:' + Math.round(num(w.fontSize, 24)) + 'px;'
          + 'color:' + (w.textColor || '#e8eefc') + ';'
          + 'caret-color:' + (w.textColor || '#e8eefc') + ';';
        inp.addEventListener('input', () => {
          let v = inp.value;
          if (w.digitsOnly) v = v.replace(/\D/g, '');
          if (maxLen > 0) v = v.slice(0, maxLen);
          if (v !== inp.value) inp.value = v;
          previewInputValues[w.uid] = v;
        });
        inp.addEventListener('focus', () => {
          el.style.borderColor = w.focusBorderColor || w.borderColor;
        });
        inp.addEventListener('blur', () => {
          el.style.borderColor = w.borderColor;
        });
        el.appendChild(inp);
      } else {
        const hasText = String(w.value || '').length > 0;
        el.style.color = hasText ? (w.textColor || '#e8eefc') : (w.placeholderColor || '#7c8aa5');
        el.style.padding = '0 12px';
        const ph = document.createElement('span');
        ph.className = hasText ? '' : 'ph';
        ph.textContent = hasText ? w.value : (w.placeholder || '');
        el.appendChild(ph);
      }
    }
    box.appendChild(el);
  });

  // 尺寸/缩放
  setZoom(zoom, zoomMode);
  renderSelection();
  updateLayerCount();
}

function renderSelection() {
  const sel = $('#selection');
  const w = selected();
  if (!w || document.body.classList.contains('preview') || w.visible === false) {
    sel.classList.remove('show');
    return;
  }
  sel.classList.add('show');
  Object.assign(sel.style, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px' });
}

function updateLayerCount() {
  $('#layerCount').textContent = '(' + project.widgets.length + ')';
}

/* ------------------------------- 图层 ------------------------------- */
function widgetName(w) {
  if (w.type === 'button' || w.type === 'input') return (w.id || TYPE_LABEL[w.type]);
  if (w.type === 'label') return w.text || '文字';
  if (w.type === 'image') return w.path || '图片';
  return TYPE_LABEL[w.type];
}
function renderLayers() {
  const box = $('#layers');
  box.innerHTML = '';
  const list = project.widgets.slice().reverse();
  list.forEach(w => {
    const row = document.createElement('div');
    row.className = 'layer' + (w.uid === selectedUid ? ' selected' : '');
    row.dataset.uid = w.uid;
    row.innerHTML = `<span class="ico">${TYPE_ICON[w.type] || '?'}</span>
      <span class="nm">${escHtml(widgetName(w))}</span>
      <button class="mini" data-action="toggle" title="显示/隐藏">${w.visible === false ? '○' : '●'}</button>
      <button class="mini" data-action="up" title="上移">↑</button>
      <button class="mini" data-action="down" title="下移">↓</button>`;
    box.appendChild(row);
  });
  updateLayerCount();
  $('#selInfo').textContent = selected() ? ('选中：' + widgetName(selected())) : '未选中';
}

function moveLayer(uidValue, delta) {
  const i = project.widgets.findIndex(w => w.uid === uidValue);
  if (i < 0) return;
  const j = i + delta;
  if (j < 0 || j >= project.widgets.length) return;
  historyForce();
  const [w] = project.widgets.splice(i, 1);
  project.widgets.splice(j, 0, w);
  renderStage(); renderLayers(); renderProps(); saveLocal();
}

/* ------------------------------- 属性 ------------------------------- */
function inputField(label, prop, value, type = 'text', step = '1', min = '', max = '') {
  return `<div class="field"><label>${label}</label>
    <input type="${type}" data-prop="${prop}" value="${escHtml(value)}" step="${step}" ${min !== '' ? `min="${min}"` : ''} ${max !== '' ? `max="${max}"` : ''}>
  </div>`;
}
function colorField(label, prop, value) {
  return `<div class="field"><label>${label}</label>
    <input type="color" data-prop="${prop}" value="${escHtml(value || '#ffffff')}">
    <span class="hint" style="margin:0">${escHtml(value || '')}</span>
  </div>`;
}
function numberField(label, prop, value, min = '', max = '') {
  return `<div class="field"><label>${label}</label>
    <input type="number" data-prop="${prop}" value="${escHtml(value)}" min="${min}" max="${max}" step="1">
  </div>`;
}
function bgImageFields(w) {

      <select data-prop="expandDir">

        <option value="up" ${w.expandDir === 'up' ? 'selected' : ''}>向上展开</option>

      html += `<div class="hint">角度按屏幕坐标：0=右，90=下，180=左，270=上；常用 200→340 是上方扇形。</div>`;

    html += `<div class="field"><label>收起规则</label><div class="chk">

      <label><input type="checkbox" data-prop="closeOnOutside" ${w.closeOnOutside ? 'checked' : ''}> 点外部收起</label>
    </div></div>`;
    html += `<div class="field"><label>默认展开</label><div class="chk">

    html += colorField('文字颜色', 'textColor', w.textColor);

    html += numberField('圆角', 'radius', w.radius, 0, 80);

    html += `<div class="hint">菜单展开/收起、菜单项点击逻辑都在生成的 onMenu_... 回调里；预览里点菜单按钮可展开。</div>`;
  }

  html += `<div class="actions-row">
      <button class="btn" data-action="center-h">水平居中</button>

  box.innerHTML = html;
}

/* ------------------------------- 拖拽/缩放 ------------------------------- */
function stageScale() {
  return $('#stage').getBoundingClientRect().width / project.designW;
}
function snapVal(v) {
  return snap ? Math.round(v / project.grid) * project.grid : Math.round(v);
}
function snapAxis(v, size, divisions, axisSize) {
  let out = snapVal(v);
  if (!project.showGuides || !project.snapGuides || divisions <= 1) return out;
  const threshold = 8;
  let best = out;
  let bestD = threshold + 1;
  for (let i = 0; i <= divisions; i++) {
    const line = axisSize * i / divisions;
    for (const anchor of [v, v + size / 2, v + size]) {
      const d = Math.abs(anchor - line);
      if (d < bestD) {
        bestD = d;
        best = line - (anchor - v);
      }
    }
  }
  return bestD <= threshold ? best : out;
}
function snapX(v, size) { return snapAxis(v, size, project.guideCols, project.designW); }
function snapY(v, size) { return snapAxis(v, size, project.guideRows, project.designH); }
function pointDesign(e) {
  const r = $('#stage').getBoundingClientRect();
  const s = r.width / project.designW;
  return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s };
}
function startDrag(e, w, mode, dir) {
  historyPush();
  drag = {
    mode, dir, uid: w.uid,
    sx: e.clientX, sy: e.clientY,
    ox: w.x, oy: w.y, ow: w.w, oh: w.h
  };
  e.preventDefault();
}
function onPointerMove(e) {
  if (!drag) return;
  const s = stageScale();
  const dx = (e.clientX - drag.sx) / s;
  const dy = (e.clientY - drag.sy) / s;
  const w = project.widgets.find(x => x.uid === drag.uid);
  if (!w) return;
  if (drag.mode === 'move') {
    w.centerH = false;
    w.centerV = false;
    w.x = snapX(drag.ox + dx, w.w);
    w.y = snapY(drag.oy + dy, w.h);
  } else {
    let x = drag.ox, y = drag.oy, ww = drag.ow, hh = drag.oh;
    if (drag.dir.includes('e')) ww = Math.max(16, drag.ow + dx);
    if (drag.dir.includes('s')) hh = Math.max(16, drag.oh + dy);
    if (drag.dir.includes('w')) { x = drag.ox + dx; ww = drag.ow - dx; }
    if (drag.dir.includes('n')) { y = drag.oy + dy; hh = drag.oh - dy; }
    if (ww < 16) { if (drag.dir.includes('w')) x = drag.ox + drag.ow - 16; ww = 16; }
    if (hh < 16) { if (drag.dir.includes('n')) y = drag.oy + drag.oh - 16; hh = 16; }
    w.w = Math.max(8, snapVal(ww)); w.h = Math.max(8, snapVal(hh));
    w.x = snapX(x, w.w); w.y = snapY(y, w.h);
    applyCentering(w);
  }
  renderStage();
  syncPosFields();
}
function onPointerUp() {
  if (!drag) return;
  drag = null;
  saveLocal();
  renderProps();
}
function syncPosFields() {
  const w = selected();
  if (!w) return;
  $$('#props [data-prop]').forEach(el => {
    if (['x','y','w','h'].includes(el.dataset.prop)) el.value = w[el.dataset.prop];
  });
  $('#selInfo').textContent = '选中：' + widgetName(w);
}

function addWidget(type) {

function duplicateSelected() {

/* ------------------------------- 属性修改 ------------------------------- */
function syncMenuHeight(w) {
  if (!w || w.type !== 'menu') return;
  w.items = (Array.isArray(w.items) ? w.items : []).map((it, i) => ({
    text: String(it.text || ('菜单项 ' + (i + 1))),
    target: String(it.target || ''),
    itemBg: String(it.itemBg || ''),
    itemHoverBg: String(it.itemHoverBg || ''),
    textColor: String(it.textColor || ''),
    fontSize: Math.max(0, Math.round(num(it.fontSize, 0))),
    enabled: it.enabled !== false,
    handler: String(it.handler || '')
  }));
  w.headerHeight = clamp(Math.round(num(w.headerHeight, 52)), 24, 200);
  w.itemHeight = clamp(Math.round(num(w.itemHeight, 44)), 20, 160);
  w.expandDir = ['down', 'up', 'left', 'right', 'fan'].includes(w.expandDir) ? w.expandDir : 'down';
  w.trigger = w.trigger === 'hover' ? 'hover' : 'click';
  w.closeOnSelect = w.closeOnSelect !== false;
  w.closeOnOutside = w.closeOnOutside !== false;
  w.fanRadius = clamp(Math.round(num(w.fanRadius, 180)), 40, 900);
  w.fanStart = Math.round(num(w.fanStart, 200));
  w.fanEnd = Math.round(num(w.fanEnd, 340));
  w.h = menuHeight(w);
}

function menuHeaderPos(w) {
  const y = w.expandDir === 'up' ? w.y + (w.items || []).length * w.itemHeight : w.y;
  return { x: w.x, y, w: w.w, h: w.headerHeight };
}

function menuItemPos(w, i) {
  const n = (w.items || []).length;
  if (w.expandDir === 'right') return { x: w.x + w.w, y: w.y + i * w.itemHeight, w: w.w, h: w.itemHeight };
  if (w.expandDir === 'left') return { x: w.x - w.w, y: w.y + i * w.itemHeight, w: w.w, h: w.itemHeight };
  if (w.expandDir === 'fan') {
    const t = n <= 1 ? 0.5 : i / (n - 1);
    const a = (w.fanStart + (w.fanEnd - w.fanStart) * t) * Math.PI / 180;
    const cx = w.x + w.w / 2;
    const cy = w.y + w.headerHeight / 2;
    return {
      x: cx + Math.cos(a) * w.fanRadius - w.w / 2,
      y: cy + Math.sin(a) * w.fanRadius - w.itemHeight / 2,
      w: w.w, h: w.itemHeight
    };
  }
  const y = w.expandDir === 'up' ? w.y + i * w.itemHeight : w.y + w.headerHeight + i * w.itemHeight;
  return { x: w.x, y, w: w.w, h: w.itemHeight };
}

function menuBounds(w) {
  const boxes = [menuHeaderPos(w), ...(w.items || []).map((_, i) => menuItemPos(w, i))];
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  boxes.forEach(r => {
    x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y);
    x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h);
  });
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}

function fitMenuToStage(w) {
  if (!w || w.type !== 'menu') return;
  const b = menuBounds(w);
  if (b.w <= project.designW) {
    if (b.x < 0) w.x -= b.x;
    else if (b.x + b.w > project.designW) w.x -= (b.x + b.w - project.designW);
  } else {
    w.x = 0;
  }
  if (b.h <= project.designH) {
    if (b.y < 0) w.y -= b.y;
    else if (b.y + b.h > project.designH) w.y -= (b.y + b.h - project.designH);
  } else {
    w.y = 0;
  }
}

function menuHeight(w) {
  const n = (w.items || []).length;
  if (w.expandDir === 'down' || w.expandDir === 'up') {
    return w.headerHeight + n * w.itemHeight;
  }
  if (w.expandDir === 'left' || w.expandDir === 'right') {
    return Math.max(w.headerHeight, n * w.itemHeight);
  }
  return w.headerHeight;
}

function applyCentering(w) {
  if (w.centerH) w.x = Math.round((project.designW - w.w) / 2);
  if (w.centerV) w.y = Math.round((project.designH - w.h) / 2);
}

function setWidgetProp(w, prop, value) {
  if (['x','y','w','h','fontSize','itemFontSize','headerHeight','itemHeight','fanRadius','fanStart','fanEnd','maxLen','borderWidth','radius'].includes(prop)) {
    value = Math.round(num(value));
    if (prop === 'w' || prop === 'h') value = Math.max(8, value);
    if (prop === 'maxLen') value = clamp(value, 0, 500);
    if (prop === 'borderWidth') value = clamp(value, 0, 20);
    if (prop === 'radius') value = clamp(value, 0, 200);
  }
  if (prop === 'visible' || prop === 'enabled' || prop === 'digitsOnly' || prop === 'password' ||
      prop === 'defaultOpen' || prop === 'closeOnSelect' || prop === 'closeOnOutside') {
    value = !!value;
  }
  w[prop] = value;
}
function applyMenuItemInput(el) {
  const w = selected();
  if (!w || w.type !== 'menu') return;
  const idx = Number(el.dataset.index);
  const it = w.items[idx];
  if (!it) return;
  const prop = el.dataset.itemProp;
  let value = el.type === 'checkbox' ? el.checked : el.value;
  if (prop === 'fontSize') value = Math.max(0, Math.round(num(value, 0)));
  if (prop === 'enabled') value = !!value;
  historyPush();
  it[prop] = value;
  if (['text', 'itemBg', 'itemHoverBg', 'textColor', 'fontSize', 'enabled'].includes(prop)) {
    renderStage();
  }
  saveLocal();
}

function onPropInput(e) {
  const itemEl = e.target.closest('[data-item-prop]');
  if (itemEl) { applyMenuItemInput(itemEl); return; }
  const el = e.target.closest('[data-prop]');
  if (!el) return;
  const prop = el.dataset.prop;
  let value = el.type === 'checkbox' ? el.checked : el.value;
  const w = selected();
  historyPush();
  if (!w) {
    if (['name','designW','designH','bg','bgImage','bgFit','grid','layout','guideCols','guideRows','showGuides','snapGuides','pageName','pageId'].includes(prop)) {
      if (['designW','designH','grid','guideCols','guideRows'].includes(prop)) value = Math.round(num(value));
      if (prop === 'guideCols') project.guideCols = clamp(value, 1, 64);
      if (prop === 'guideRows') project.guideRows = clamp(value, 1, 64);
      if (prop === 'showGuides') project.showGuides = !!value;
      if (prop === 'snapGuides') project.snapGuides = !!value;
      if (['guideCols','guideRows','showGuides','snapGuides'].includes(prop)) {
        $('#guideCols').value = project.guideCols;
        $('#guideRows').value = project.guideRows;
        $('#guideChk').checked = project.showGuides;
        $('#guideSnapChk').checked = project.snapGuides;
        renderGuides();
        saveLocal();
        return;
      }
      if (prop === 'pageName') {
        project.pages[project.activePage].name = String(value).trim() || project.pages[project.activePage].name;
        renderPageTabs();
        saveLocal();
        return;
      }
      if (prop === 'pageId') {
        project.pages[project.activePage].id = String(value).trim() || project.pages[project.activePage].id;
        renderPageTabs();
        saveLocal();
        return;
      }
      if (prop === 'layout') {
        project.layout = value === 'fixed' ? 'fixed' : 'percent';
        renderProps();
        saveLocal();
        return;
      }
      project[prop] = value;
      if (prop === 'designW') project.designW = clamp(num(value, 1280), 320, 3840);
      if (prop === 'designH') project.designH = clamp(num(value, 720), 240, 2160);
      if (prop === 'grid') project.grid = clamp(num(value, 8), 2, 64);
      if (prop === 'name') $('#projectName').value = project.name;
      $('#gridSize').textContent = project.grid;
      if (prop === 'designW' || prop === 'designH') {
        project.widgets.forEach(applyCentering);
      }
      renderStage();
      fitIfNeeded();
      saveLocal();
    }
    return;
  }
  if (w.type === 'menu' && prop === 'itemsText') {
    w.items = String(value).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    syncMenuHeight(w);
    renderStage();
    renderLayers();
    saveLocal();
    return;
  }
  setWidgetProp(w, prop, value);
  if (w.type === 'menu' && ['headerHeight', 'itemHeight', 'expandDir', 'fanRadius', 'fanStart', 'fanEnd'].includes(prop)) {
    syncMenuHeight(w);
    fitMenuToStage(w);
    if (prop === 'expandDir') renderProps();
  }
  if (prop === 'x') w.centerH = false;
  if (prop === 'y') w.centerV = false;
  if (prop === 'w' || prop === 'h') applyCentering(w);
  renderStage();
  if (prop === 'id' || prop === 'text' || prop === 'placeholder') renderLayers();
  saveLocal();
}

/* ------------------------------- 缩放 ------------------------------- */
function setZoom(z, mode) {

  $('#stageHolder').style.height = (project.designH * zoom) + 'px';

}
function fitIfNeeded() {
  if (zoomMode !== 'fit') return;
  const wrap = $('#stageWrap');
  const z = Math.min((wrap.clientWidth - 48) / project.designW, (wrap.clientHeight - 48) / project.designH, 1);

function applyZoomSelection() {
  const v = $('#zoomSel').value;

}

/* ------------------------------- 代码生成 ------------------------------- */
function generateCode(p) {
  const W = p.designW, H = p.designH;
  const bgImage = String(p.bgImage || '').trim();
  const pages = (Array.isArray(p.pages) && p.pages.length ? p.pages : [{ key: 'p1', id: 'MAIN', name: '主页面', widgets: [] }])
    .map((pg, pi) => ({
      key: pg.key || ('p' + pi),
      id: pg.id || ('PAGE_' + (pi + 1)),
      name: pg.name || ('页面 ' + (pi + 1)),
      widgets: (pg.widgets || []).map(w => Object.assign({}, w)),
      _index: pi
    }));
  const multi = pages.length > 1;
  const percent = p.layout !== 'fixed';
  const fnum = n => String(Math.round(n * 10000) / 10000);
  const rectExpr = w => percent
    ? `pctRect(vp, ${fnum(w.x / W)}, ${fnum(w.y / H)}, ${fnum(w.w / W)}, ${fnum(w.h / H)})`
    : `Rect{ ${w.x}, ${w.y}, ${w.w}, ${w.h} }`;
  const rectAt = (w, dy, hh) => percent
    ? `pctRect(vp, ${fnum(w.x / W)}, ${fnum((w.y + dy) / H)}, ${fnum(w.w / W)}, ${fnum(hh / H)})`
    : `Rect{ ${w.x}, ${w.y + dy}, ${w.w}, ${hh} }`;
  const posExpr = p => percent
    ? `pctRect(vp, ${fnum(p.x / W)}, ${fnum(p.y / H)}, ${fnum(p.w / W)}, ${fnum(p.h / H)})`
    : `Rect{ ${Math.round(p.x)}, ${Math.round(p.y)}, ${Math.round(p.w)}, ${Math.round(p.h)} }`;
  const menuHeaderExpr = w => posExpr(menuHeaderPos(w));
  const menuItemExpr = (w, i) => posExpr(menuItemPos(w, i));
  const menuBoundsExpr = w => posExpr(menuBounds(w));

  const usedPageIds = new Set();
  pages.forEach((pg, pi) => {
    const base = cppIdent(pg.id, 'PAGE_' + (pi + 1));
    let id = 'UI_PAGE_' + base;
    let n = 2;
    while (usedPageIds.has(id)) id = 'UI_PAGE_' + base + '_' + (n++);
    usedPageIds.add(id);
    pg._cppId = id;
  });

  const usedButtonIds = new Set();
  const usedMenuFuncs = new Set();
  pages.forEach(pg => {
    pg.buttons = [];
    pg.inputs = [];
    pg.images = [];
    pg.menus = [];
    let bgIndex = 0;
    let menuIndex = 0;
    const prefix = multi ? cppIdent(pg.id, 'PAGE') + '_' : '';
    pg.widgets.forEach((w, wi) => {
      if (['button', 'panel', 'input'].includes(w.type) && String(w.bgImage || '').trim()) {
        w._bgVar = 'g_p' + pg._index + '_bg_' + (++bgIndex);
      }
      if (w.type === 'button') {
        const base = cppIdent(w.id, 'BTN_' + (wi + 1));
        let id = 'UI_' + prefix + base;
        let n = 2;
        while (usedButtonIds.has(id)) id = 'UI_' + prefix + base + '_' + (n++);
        usedButtonIds.add(id);
        w._id = id;
        w._func = 'onButton_' + id.replace(/^UI_/, '');
        pg.buttons.push(w);
        if (String(w.iconPath || '').trim()) {
          w._iconVar = 'g_p' + pg._index + '_icon_' + pg.buttons.length;
        }
        if (w.target) {
          const t = pages.find(x => x.key === w.target);
          w._targetId = t ? t._cppId : '';
          w._targetName = t ? t.name : '';
        }
      } else if (w.type === 'input') {
        pg.inputs.push(w);
        w._var = 'g_p' + pg._index + '_input_' + pg.inputs.length;
      } else if (w.type === 'image') {
        if (String(w.path || '').trim()) {
          pg.images.push(w);
          w._var = 'g_p' + pg._index + '_img_' + pg.images.length;
        }
      } else if (w.type === 'menu') {
        pg.menus.push(w);
        w._openVar = 'g_p' + pg._index + '_menu_' + (++menuIndex) + '_open';
        let mbase = (multi ? cppIdent(pg.id, 'PAGE') + '_' : '') + cppIdent(w.id, 'MENU_' + menuIndex);
        let mn = 2;
        while (usedMenuFuncs.has(mbase)) mbase = mbase + '_' + (mn++);
        usedMenuFuncs.add(mbase);
        w._menuFuncBase = 'onMenu_' + mbase;
        w._toggleFunc = w._menuFuncBase + '_Toggle';
        w._itemFuncs = (w.items || []).map((_, i) => w._menuFuncBase + '_Item' + (i + 1));
      }
    });
  });

  const allWidgets = pages.flatMap(pg => pg.widgets);
  const allButtons = pages.flatMap(pg => pg.buttons);
  const allInputs = pages.flatMap(pg => pg.inputs);

  i8('switch (g_page)');

    i8('    break;');
  });
  i8('default:');
  i8('    break;');

  i4('}');

  a('} // namespace ui');
  a('');
  a('// 在 main 中调用：');
