<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ezx-core UI 编辑器</title>
<style>
  :root{
    --bg:#0e1117;
    --panel:#151922;
    --panel2:#1b202b;
    --line:#2a3142;
    --text:#dce5f5;
    --muted:#8d98ad;
    --accent:#4f8cff;
    --accent2:#6eaaff;
    --danger:#ff6b6b;
    --top:54px;
    --left:224px;
    --right:304px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.5 system-ui,"Microsoft YaHei","Segoe UI",sans-serif;
    overflow:hidden;
  }
  button{font:inherit;cursor:pointer}
  .topbar{
    height:var(--top); display:flex; align-items:center; gap:10px;
    padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line);
    position:relative; z-index:20;
  }
  .brand{font-weight:700; font-size:15px; white-space:nowrap}
  .brand span{color:var(--muted); font-weight:400; margin-left:6px; font-size:12px}
  .project-name{
    width:180px; margin-left:8px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:6px 9px; outline:none;
  }
  .project-name:focus{border-color:var(--accent)}
  .actions{display:flex; align-items:center; gap:6px; margin-left:auto}
  .btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; white-space:nowrap;
  }
  .btn:hover{border-color:#40506e; background:#222938}
  .btn:disabled{opacity:.4; cursor:default}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .btn.primary:hover{background:#3f7df0}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger)}
  .divider{width:1px; height:22px; background:var(--line); margin:0 4px}
  main{height:calc(100% - var(--top)); display:grid; grid-template-columns:var(--left) 1fr var(--right)}
  aside{background:var(--panel); overflow:auto; padding:12px}
  aside.left{border-right:1px solid var(--line)}
  aside.right{border-left:1px solid var(--line)}
  h3{margin:4px 0 8px; font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.4px}
  h3:not(:first-child){margin-top:18px}
  .palette{display:grid; grid-template-columns:1fr 1fr; gap:7px}
  .pal-btn{
    background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    padding:9px 6px; color:var(--text); text-align:center;
  }
  .pal-btn:hover{border-color:var(--accent); background:#1e2a40}
  .pal-btn b{display:block; font-size:18px; font-weight:400; line-height:1.2; color:var(--accent2)}
  .pal-btn small{color:var(--muted)}
  #layers{display:flex; flex-direction:column; gap:4px; margin-top:4px}
  .layer{
    display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:5px;
    border:1px solid transparent; background:var(--panel2); cursor:pointer;
  }
  .layer:hover{border-color:#3b4b68}
  .layer.selected{border-color:var(--accent); background:#1d2a42}
  .layer .ico{width:18px; text-align:center; color:var(--accent2)}
  .layer .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .layer .mini{
    background:transparent; border:0; color:var(--muted); padding:0 2px; font-size:12px;
  }
  .layer .mini:hover{color:var(--text)}
  .workspace{position:relative; overflow:hidden; display:flex; flex-direction:column}
  #stageWrap{flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:24px}
  #stageHolder{position:relative; flex:none}
  #stage{
    position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden;
    box-shadow:0 18px 60px rgba(0,0,0,.55); background:#12141c;
  }
  #grid{position:absolute; inset:0; pointer-events:none; opacity:.7}
  #widgets{position:absolute; inset:0}
  .widget{position:absolute; user-select:none; cursor:move; overflow:hidden}
  .widget.hidden{display:none}
  .widget.disabled{opacity:.65}
  .w-button{display:flex; align-items:center; justify-content:center; text-align:center; white-space:pre-wrap}
  .w-label{display:flex; align-items:center; white-space:pre-wrap; overflow:hidden}
  .w-panel{}
  .w-image{display:flex; align-items:center; justify-content:center; background:#0b0e14; color:#5b6b86; overflow:hidden}
  .w-image img{width:100%; height:100%; display:block}
  .w-input{display:flex; align-items:center; overflow:hidden; white-space:nowrap}
  .w-input .ph{opacity:.65}
  #selection{position:absolute; pointer-events:none; z-index:99; display:none}
  #selection.show{display:block}
  #selection .box{position:absolute; inset:0; border:1.5px dashed var(--accent2); box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  .handle{
    position:absolute; width:9px; height:9px; margin:-5px 0 0 -5px; background:#fff;
    border:1px solid var(--accent); border-radius:2px; pointer-events:auto; z-index:100;
  }
  .handle[data-dir="nw"]{left:0;top:0;cursor:nwse-resize}
  .handle[data-dir="n"]{left:50%;top:0;cursor:ns-resize}
  .handle[data-dir="ne"]{left:100%;top:0;cursor:nesw-resize}
  .handle[data-dir="e"]{left:100%;top:50%;cursor:ew-resize}
  .handle[data-dir="se"]{left:100%;top:100%;cursor:nwse-resize}
  .handle[data-dir="s"]{left:50%;top:100%;cursor:ns-resize}
  .handle[data-dir="sw"]{left:0;top:100%;cursor:nesw-resize}
  .handle[data-dir="w"]{left:0;top:50%;cursor:ew-resize}
  .statusbar{
    height:34px; border-top:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:14px; padding:0 12px; color:var(--muted); font-size:12px;
  }
  .statusbar label{display:flex; align-items:center; gap:5px; cursor:pointer}
  .statusbar select{background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 4px}
  .statusbar .right{margin-left:auto}
  #props{font-size:12px}
  .field{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .field label{width:78px; color:var(--muted); flex:none}
  .field input[type=text],.field input[type=number],.field select,.field textarea{
    flex:1; min-width:0; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); border-radius:5px; padding:5px 7px; outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field input[type=color]{
    width:36px; height:26px; padding:1px; background:var(--panel2);
    border:1px solid var(--line); border-radius:4px;
  }
  .field textarea{height:82px; resize:vertical; font-family:Consolas,"Courier New",monospace; font-size:12px}
  .field .chk{flex:1; display:flex; gap:12px; align-items:center}
  .field .chk label{width:auto; display:flex; align-items:center; gap:4px; color:var(--text); cursor:pointer}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .row2 .field{display:block; margin-bottom:0}
  .row2 .field label{display:block; width:auto; margin-bottom:3px}
  .row2 .field input{width:100%}
  .hint{color:var(--muted); font-size:11px; line-height:1.5; margin:6px 0 10px}
  .type-title{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:14px; font-weight:600}
  .badge{background:#22304a; color:var(--accent2); border-radius:4px; padding:1px 6px; font-size:11px}
  .actions-row{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0}
  .actions-row .btn{padding:5px 8px; font-size:12px}
  .empty{color:var(--muted); padding:10px 0; line-height:1.8}
  .modal{
    position:fixed; inset:0; background:rgba(4,7,12,.78); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .modal.hidden{display:none}
  .modal-card{
    width:min(1080px,96vw); height:min(820px,92vh); background:var(--panel);
    border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column;
    box-shadow:0 30px 90px rgba(0,0,0,.6);
  }
  .modal-head{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0; font-size:15px}
  .modal-head .actions{margin-left:auto; display:flex; gap:6px}
  .modal-body{flex:1; overflow:auto; padding:12px 16px; background:#0b0e14}
  #codeOut{
    margin:0; white-space:pre; font:12px/1.55 Consolas,"Courier New",monospace;
    color:#cfe0ff; tab-size:4;
  }
  #toast{
    position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(12px);
    background:#24314a; border:1px solid #3e5478; color:#e8f0ff; padding:8px 14px;
    border-radius:6px; opacity:0; pointer-events:none; transition:.2s; z-index:300;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  body.preview .topbar,body.preview aside,body.preview .statusbar{display:none}
  body.preview main{height:100%; grid-template-columns:1fr}
  body.preview #stageWrap{padding:0}
  body.preview #grid{display:none}
  #previewExit{
    position:fixed; right:16px; top:16px; z-index:400; display:none;
    background:rgba(20,26,38,.9); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:7px 12px;
  }
  body.preview #previewExit{display:block}
  body.preview .widget{cursor:default}
  @media (max-width:1100px){
    :root{--left:190px;--right:270px}
    .project-name{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">ezx-core <span>UI 编辑器</span></div>
  <input id="projectName" class="project-name" placeholder="项目名">
  <div class="actions">
    <button class="btn" id="btnNew">新建</button>
    <button class="btn" id="btnSample">示例</button>
    <button class="btn" id="btnOpen">打开</button>
    <button class="btn" id="btnSave">保存</button>
    <span class="divider"></span>
    <button class="btn" id="btnUndo" title="Ctrl+Z">撤销</button>
    <button class="btn" id="btnRedo" title="Ctrl+Y">重做</button>
    <span class="divider"></span>
    <button class="btn" id="btnPreview">预览</button>
    <button class="btn primary" id="btnCode">生成代码</button>
  </div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
</header>

<main>
  <aside class="left">
    <h3>添加控件</h3>
    <div class="palette">
      <button class="pal-btn" data-add="button"><b>▭</b><small>按钮</small></button>
      <button class="pal-btn" data-add="label"><b>T</b><small>文字</small></button>
      <button class="pal-btn" data-add="panel"><b>▦</b><small>面板</small></button>
      <button class="pal-btn" data-add="image"><b>◫</b><small>图片</small></button>
      <button class="pal-btn" data-add="input"><b>⌨</b><small>输入框</small></button>
    </div>
    <h3>图层 <span id="layerCount" style="color:var(--muted)"></span></h3>
    <div id="layers"></div>
  </aside>

  <section class="workspace">
    <div id="stageWrap">
      <div id="stageHolder">
        <div id="stage">
          <div id="grid"></div>
          <div id="widgets"></div>
          <div id="selection">
            <div class="box"></div>
            <div class="handle" data-dir="nw"></div>
            <div class="handle" data-dir="n"></div>
            <div class="handle" data-dir="ne"></div>
            <div class="handle" data-dir="e"></div>
            <div class="handle" data-dir="se"></div>
            <div class="handle" data-dir="s"></div>
            <div class="handle" data-dir="sw"></div>
            <div class="handle" data-dir="w"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="statusbar">
      <label><input type="checkbox" id="snapChk" checked> 网格吸附</label>
      <span>网格 <b id="gridSize">8</b> px</span>
      <span>缩放
        <select id="zoomSel">
          <option value="fit">适应</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
        </select>
      </span>
      <span id="selInfo" class="right">未选中</span>
    </div>
  </section>

  <aside class="right">
    <h3>属性</h3>
    <div id="props"></div>
  </aside>
</main>

<button id="previewExit">退出预览 (Esc)</button>

<div id="codeModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>生成的 C++ 代码</h2>
      <span class="hint" style="margin:0">保存为 ui_generated.cpp，加到工程里</span>
      <div class="actions">
        <button class="btn" id="btnCopy">复制</button>
        <button class="btn" id="btnDownload">下载 .cpp</button>
        <button class="btn" id="btnCloseModal">关闭</button>
      </div>
    </div>
    <div class="modal-body"><pre id="codeOut"></pre></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================================
   ezx-core UI 编辑器
   - 数据模型：project.widgets[]
   - 输出：ui_generated.cpp（调用 ui::init / ui::update / ui::draw）
   ========================================================================= */
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const W_DEFAULT = 1280, H_DEFAULT = 720;
const LS_KEY = 'ezx-ui-editor-v1';

let project = null;
let selectedUid = null;
let zoom = 1;
let zoomMode = 'fit';
let snap = true;
let drag = null;
let undoStack = [];
let redoStack = [];
let lastHistoryAt = 0;
let generatedCode = '';
let uidSeq = 1;

/* ------------------------------- 工具 ------------------------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d = 0) => {
  const n = Number(v);
  return Number.isFinite(n) ? n : d;
};
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const uid = () => 'w' + (uidSeq++);
const deep = o => JSON.parse(JSON.stringify(o));

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function hexToRgb(hex) {
  let s = String(hex || '').trim();
  if (!s.startsWith('#')) s = '#' + s;
  const m = /^#([0-9a-f]{6})$/i.exec(s);
  if (!m) return [255, 255, 255];
  const v = parseInt(m[1], 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function rgbExpr(hex) {
  const [r, g, b] = hexToRgb(hex);
  return `RGB(${r}, ${g}, ${b})`;
}
function cppString(s) {
  return '"' + String(s ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\r/g, '')
    .replace(/\n/g, '\\n') + '"';
}
function cppIdent(s, fallback) {
  let x = String(s || '').trim().replace(/[^A-Za-z0-9_]/g, '_');
  if (!x || !/^[A-Za-z_]/.test(x)) x = fallback;
  return x;
}
function alignExpr(a) {
  return a === 'left' ? 'Align::Left' : a === 'right' ? 'Align::Right' : 'Align::Center';
}

/* ------------------------------- 数据 ------------------------------- */
const TYPE_LABEL = { button: '按钮', label: '文字', panel: '面板', image: '图片', input: '输入框' };
const TYPE_ICON = { button: '▭', label: 'T', panel: '▦', image: '◫', input: '⌨' };

function defaults(type) {
  const base = {
    uid: uid(), type, id: '', x: 0, y: 0, w: 200, h: 60,
    visible: true, enabled: true
  };
  if (type === 'button') return Object.assign(base, {
    w: 280, h: 64, text: '按钮', fontSize: 28,
    textColor: '#eef2ff', normalBg: '#222a3e', hoverBg: '#3e5684',
    borderColor: '#5c7cc4', borderWidth: 2, radius: 8,
    disabledBg: '#262a33', disabledText: '#777d8a',
    handler: '// TODO: 在这里写点击逻辑'
  });
  if (type === 'label') return Object.assign(base, {
    w: 300, h: 44, text: '文字', fontSize: 28, color: '#e8eefc', align: 'center'
  });
  if (type === 'panel') return Object.assign(base, {
    w: 360, h: 220, fillColor: '#1a2030',
    borderColor: '#3a4a6a', borderWidth: 2, radius: 10
  });
  if (type === 'image') return Object.assign(base, {
    w: 200, h: 200, path: 'res/logo.png', fit: 'fit', previewData: ''
  });
  if (type === 'input') return Object.assign(base, {
    w: 320, h: 60, fontSize: 24, maxLen: 16,
    digitsOnly: false, password: false,
    placeholder: '请输入…', value: '',
    inputBg: '#181e2c', borderColor: '#4a5a7a',
    focusBorderColor: '#6eaaff', textColor: '#e8eefc',
    placeholderColor: '#7c8aa5', radius: 8, borderWidth: 2
  });
  return base;
}

function makeWidget(type, x, y) {
  const w = defaults(type);
  w.x = Math.round(x);
  w.y = Math.round(y);
  if (type === 'button') w.id = uniqueId('BTN');
  if (type === 'input') w.id = uniqueId('INPUT');
  return w;
}

function uniqueId(prefix) {
  const used = new Set(project ? project.widgets.map(w => String(w.id || '').toUpperCase()) : []);
  let i = 1;
  while (used.has((prefix + '_' + i).toUpperCase())) i++;
  return prefix + '_' + i;
}

function normalizeProject(p) {
  const out = Object.assign({
    version: 1, name: '未命名界面',
    designW: W_DEFAULT, designH: H_DEFAULT,
    bg: '#12141c', grid: 8,
    widgets: []
  }, p || {});
  out.designW = clamp(num(out.designW, W_DEFAULT), 320, 3840);
  out.designH = clamp(num(out.designH, H_DEFAULT), 240, 2160);
  out.grid = clamp(num(out.grid, 8), 2, 64);
  out.widgets = Array.isArray(out.widgets) ? out.widgets : [];
  const seen = new Set();
  out.widgets.forEach((w, i) => {
    const d = defaults(w.type || 'button');
    const merged = Object.assign({}, d, w);
    Object.assign(w, merged);
    while (!w.uid || seen.has(w.uid)) w.uid = uid();
    seen.add(w.uid);
    w.x = Math.round(num(w.x));
    w.y = Math.round(num(w.y));
    w.w = Math.max(8, Math.round(num(w.w, 100)));
    w.h = Math.max(8, Math.round(num(w.h, 40)));
    if (w.type === 'button' && !w.id) w.id = 'BTN_' + (i + 1);
    if (w.type === 'input' && !w.id) w.id = 'INPUT_' + (i + 1);
  });
  return out;
}

function sampleProject() {
  const p = normalizeProject({
    name: '我的游戏',
    designW: 1280, designH: 720,
    bg: '#12141c', grid: 8,
    widgets: [
      { type: 'image', x: 565, y: 55, w: 150, h: 150, path: 'res/logo.png', fit: 'fit' },
      { type: 'label', x: 0, y: 220, w: 1280, h: 70, text: '我的游戏', fontSize: 52, color: '#f2f6ff', align: 'center' },
      { type: 'button', id: 'BTN_START', x: 480, y: 320, w: 320, h: 60, text: '开始游戏', fontSize: 28, handler: '// TODO: 开始游戏\n// startGame();' },
      { type: 'button', id: 'BTN_SETTINGS', x: 480, y: 392, w: 320, h: 60, text: '设置', fontSize: 28 },
      { type: 'button', id: 'BTN_QUIT', x: 480, y: 464, w: 320, h: 60, text: '退出', fontSize: 28 },
      { type: 'input', id: 'INPUT_NAME', x: 480, y: 560, w: 320, h: 60, placeholder: '输入昵称…', fontSize: 24, maxLen: 12 }
    ]
  });
  return p;
}

function blankProject() {
  return normalizeProject({
    name: '未命名界面',
    designW: W_DEFAULT, designH: H_DEFAULT,
    bg: '#12141c', grid: 8, widgets: []
  });
}

/* ------------------------------- 历史 ------------------------------- */
function historyPush() {
  const now = Date.now();
  if (now - lastHistoryAt < 450) return;
  lastHistoryAt = now;
  undoStack.push(JSON.stringify(project));
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}
function historyForce() {
  undoStack.push(JSON.stringify(project));
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(project));
  project = normalizeProject(JSON.parse(undoStack.pop()));
  selectedUid = null;
  renderAll();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(project));
  project = normalizeProject(JSON.parse(redoStack.pop()));
  selectedUid = null;
  renderAll();
}

/* ------------------------------- 保存 ------------------------------- */
function serializeProject() {
  const p = deep(project);
  p.widgets.forEach(w => { delete w.previewData; });
  return p;
}
let saveTimer = null;
function saveLocal() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(serializeProject()));
    } catch (e) { /* 忽略 quota 错误 */ }
  }, 250);
}
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 200);
}

/* ------------------------------- 选择 ------------------------------- */
function selected() {
  return project.widgets.find(w => w.uid === selectedUid) || null;
}

function renderStage() {
  const stage = $('#stage');
  stage.style.width = project.designW + 'px';
  stage.style.height = project.designH + 'px';
  stage.style.background = project.bg;
  const grid = $('#grid');
  grid.style.backgroundImage = gridCss(project.grid);
  grid.style.backgroundSize = `${project.grid}px ${project.grid}px`;

  const box = $('#widgets');
  box.innerHTML = '';
  project.widgets.forEach(w => {
    const el = document.createElement('div');
    el.className = 'widget w-' + w.type + (w.visible === false ? ' hidden' : '') + (w.enabled === false ? ' disabled' : '');
    el.dataset.uid = w.uid;
    Object.assign(el.style, {
      left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px',
      borderRadius: (w.radius || 0) + 'px'
    });
    if (w.borderWidth) {
      el.style.border = `${w.borderWidth}px solid ${w.borderColor || '#555'}`;
    }
    if (w.type === 'button') {
      el.style.background = w.normalBg || '#222a3e';
      el.style.color = w.textColor || '#fff';
      el.style.fontSize = (w.fontSize || 28) + 'px';
      el.textContent = w.text || '';
      if (w.enabled !== false) {
        el.addEventListener('mouseenter', () => { el.style.background = w.hoverBg || w.normalBg; });
        el.addEventListener('mouseleave', () => { el.style.background = w.normalBg || '#222a3e'; });
      }
    } else if (w.type === 'label') {
      el.style.color = w.color || '#fff';
      el.style.fontSize = (w.fontSize || 28) + 'px';
      el.textContent = w.text || '';
      el.style.justifyContent = w.align === 'left' ? 'flex-start' : w.align === 'right' ? 'flex-end' : 'center';
      el.style.textAlign = w.align || 'center';
    } else if (w.type === 'panel') {
      el.style.background = w.fillColor || '#1a2030';
    } else if (w.type === 'image') {
      if (w.previewData) {
        const img = document.createElement('img');
        img.src = w.previewData;
        img.alt = '';
        img.style.objectFit = w.fit === 'cover' ? 'cover' : w.fit === 'stretch' ? 'fill' : 'contain';
        el.appendChild(img);
      } else {
        el.textContent = w.path ? ('🖼 ' + w.path) : '图片';
        el.style.fontSize = '12px';
        el.style.padding = '6px';
        el.style.textAlign = 'center';
      }
    } else if (w.type === 'input') {
      const hasText = String(w.value || '').length > 0;
      el.style.background = w.inputBg || '#181e2c';
      el.style.color = hasText ? (w.textColor || '#e8eefc') : (w.placeholderColor || '#7c8aa5');
      el.style.fontSize = (w.fontSize || 24) + 'px';
      el.style.padding = '0 12px';
      const ph = document.createElement('span');
      ph.className = hasText ? '' : 'ph';
      ph.textContent = hasText ? w.value : (w.placeholder || '');
      el.appendChild(ph);
    }
    box.appendChild(el);
  });

  // 尺寸/缩放
  setZoom(zoom, zoomMode);
  renderSelection();
  updateLayerCount();
}

function renderSelection() {
  const sel = $('#selection');
  const w = selected();
  if (!w || document.body.classList.contains('preview') || w.visible === false) {
    sel.classList.remove('show');
    return;

  sel.classList.add('show');
  Object.assign(sel.style, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px' });

/* ------------------------------- 图层 ------------------------------- */
function widgetName(w) {
  if (w.type === 'button' || w.type === 'input') return (w.id || TYPE_LABEL[w.type]);
  if (w.type === 'label') return w.text || '文字';
  if (w.type === 'image') return w.path || '图片';
  return TYPE_LABEL[w.type];
}
function renderLayers() {
  const box = $('#layers');
  box.innerHTML = '';
  const list = project.widgets.slice().reverse();
  list.forEach(w => {
    const row = document.createElement('div');
    row.className = 'layer' + (w.uid === selectedUid ? ' selected' : '');
    row.dataset.uid = w.uid;
    row.innerHTML = `<span class="ico">${TYPE_ICON[w.type] || '?'}</span>
      <span class="nm">${escHtml(widgetName(w))}</span>
      <button class="mini" data-action="toggle" title="显示/隐藏">${w.visible === false ? '○' : '●'}</button>
      <button class="mini" data-action="up" title="上移">↑</button>
      <button class="mini" data-action="down" title="下移">↓</button>`;
    box.appendChild(row);
  });
  updateLayerCount();
  $('#selInfo').textContent = selected() ? ('选中：' + widgetName(selected())) : '未选中';
}

function moveLayer(uidValue, delta) {
  const i = project.widgets.findIndex(w => w.uid === uidValue);
  if (i < 0) return;
  const j = i + delta;
  if (j < 0 || j >= project.widgets.length) return;
  historyForce();
  const [w] = project.widgets.splice(i, 1);
  project.widgets.splice(j, 0, w);
  renderStage(); renderLayers(); renderProps(); saveLocal();
}

/* ------------------------------- 拖拽/缩放 ------------------------------- */
function stageScale() {
  return $('#stage').getBoundingClientRect().width / project.designW;
}
function snapVal(v) {
  return snap ? Math.round(v / project.grid) * project.grid : Math.round(v);
}
function pointDesign(e) {
  const r = $('#stage').getBoundingClientRect();
  const s = r.width / project.designW;
  return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s };
}
function startDrag(e, w, mode, dir) {
  historyPush();
  drag = {
    mode, dir, uid: w.uid,
    sx: e.clientX, sy: e.clientY,
    ox: w.x, oy: w.y, ow: w.w, oh: w.h
  };
  e.preventDefault();
}
function onPointerMove(e) {
  if (!drag) return;
  const s = stageScale();
  const dx = (e.clientX - drag.sx) / s;
  const dy = (e.clientY - drag.sy) / s;
  const w = project.widgets.find(x => x.uid === drag.uid);
  if (!w) return;
  if (drag.mode === 'move') {
    w.x = snapVal(drag.ox + dx);
    w.y = snapVal(drag.oy + dy);
  } else {
    let x = drag.ox, y = drag.oy, ww = drag.ow, hh = drag.oh;
    if (drag.dir.includes('e')) ww = Math.max(16, drag.ow + dx);
    if (drag.dir.includes('s')) hh = Math.max(16, drag.oh + dy);
    if (drag.dir.includes('w')) { x = drag.ox + dx; ww = drag.ow - dx; }
    if (drag.dir.includes('n')) { y = drag.oy + dy; hh = drag.oh - dy; }
    if (ww < 16) { if (drag.dir.includes('w')) x = drag.ox + drag.ow - 16; ww = 16; }
    if (hh < 16) { if (drag.dir.includes('n')) y = drag.oy + drag.oh - 16; hh = 16; }
    w.x = snapVal(x); w.y = snapVal(y);
    w.w = Math.max(8, snapVal(ww)); w.h = Math.max(8, snapVal(hh));
  }
  renderStage();
  syncPosFields();
}
function onPointerUp() {
  if (!drag) return;
  drag = null;
  saveLocal();
  renderProps();
}
function syncPosFields() {
  const w = selected();
  if (!w) return;
  $$('#props [data-prop]').forEach(el => {
    if (['x','y','w','h'].includes(el.dataset.prop)) el.value = w[el.dataset.prop];
  });
  $('#selInfo').textContent = '选中：' + widgetName(w);
}

/* ------------------------------- 添加/删除 ------------------------------- */
function addWidget(type) {
  const w = makeWidget(type, 0, 0);
  w.x = snapVal((project.designW - w.w) / 2) + (project.widgets.length % 5) * 18;
  w.y = snapVal((project.designH - w.h) / 2) + (project.widgets.length % 5) * 18;
  historyForce();
  project.widgets.push(w);
  selectedUid = w.uid;
  renderAll();
  toast('已添加：' + TYPE_LABEL[type]);
}
function deleteSelected() {
  const w = selected(); if (!w) return;
  historyForce();
  project.widgets = project.widgets.filter(x => x.uid !== w.uid);
  selectedUid = null;
  renderAll();
}
function duplicateSelected() {
  const w = selected(); if (!w) return;
  historyForce();
  const copy = deep(w);
  copy.uid = uid();
  copy.x += 20; copy.y += 20;
  if (copy.type === 'button') copy.id = uniqueId('BTN');
  if (copy.type === 'input') copy.id = uniqueId('INPUT');
  project.widgets.push(copy);
  selectedUid = copy.uid;
  renderAll();
}

/* ------------------------------- 属性修改 ------------------------------- */
function setWidgetProp(w, prop, value) {
  if (['x','y','w','h','fontSize','maxLen','borderWidth','radius'].includes(prop)) {
    value = Math.round(num(value));
    if (prop === 'w' || prop === 'h') value = Math.max(8, value);
    if (prop === 'maxLen') value = clamp(value, 0, 500);
    if (prop === 'borderWidth') value = clamp(value, 0, 20);
    if (prop === 'radius') value = clamp(value, 0, 200);
  }
  if (prop === 'visible' || prop === 'enabled' || prop === 'digitsOnly' || prop === 'password') {
    value = !!value;
  }
  w[prop] = value;
}
function onPropInput(e) {
  const el = e.target.closest('[data-prop]');
  if (!el) return;
  const prop = el.dataset.prop;
  let value = el.type === 'checkbox' ? el.checked : el.value;
  const w = selected();
  historyPush();
  if (!w) {
    if (['name','designW','designH','bg','grid'].includes(prop)) {
      if (['designW','designH','grid'].includes(prop)) value = Math.round(num(value));
      project[prop] = value;
      if (prop === 'designW') project.designW = clamp(num(value, 1280), 320, 3840);
      if (prop === 'designH') project.designH = clamp(num(value, 720), 240, 2160);
      if (prop === 'grid') project.grid = clamp(num(value, 8), 2, 64);
      if (prop === 'name') $('#projectName').value = project.name;
      $('#gridSize').textContent = project.grid;
      renderStage();
      fitIfNeeded();
      saveLocal();
    }
    return;
  }
  setWidgetProp(w, prop, value);
  renderStage();
  if (prop === 'id' || prop === 'text' || prop === 'placeholder') renderLayers();
  saveLocal();
}

  $('#zoomSel').value = mode === 'fit' ? 'fit' : String(zoom);

  const wrap = $('#stageWrap');

  setZoom(Math.max(0.1, z), 'fit');
}

}

/* ------------------------------- 代码弹窗 ------------------------------- */
function openCode() {
  generatedCode = generateCode(project);
  $('#codeOut').textContent = generatedCode;
  $('#codeModal').classList.remove('hidden');
}
function closeCode() { $('#codeModal').classList.add('hidden'); }
async function copyCode() {
  try {
    await navigator.clipboard.writeText(generatedCode);
    toast('已复制到剪贴板');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = generatedCode;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (_) { toast('复制失败，请手动选择'); }
    ta.remove();
  }
}

/* ------------------------------- 初始化/事件 ------------------------------- */
function renderAll() {
  $('#projectName').value = project.name || '';
  $('#gridSize').textContent = project.grid;
  renderStage();
  renderLayers();
  renderProps();
  fitIfNeeded();
  saveLocal();
}

function loadProject(p, silent) {
  project = normalizeProject(p);
  selectedUid = null;
  undoStack = [];
  redoStack = [];
  zoomMode = 'fit';
  renderAll();
  if (!silent) toast('已载入');
}

function init() {
  const params = new URLSearchParams(location.search);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { saved = null; }
  project = saved ? normalizeProject(saved) : sampleProject();
  if (params.has('empty')) project = blankProject();

  // 项目名
  $('#projectName').addEventListener('input', e => {
    project.name = e.target.value;
    saveLocal();
  });

  // 工具栏
  $('#btnNew').addEventListener('click', () => {
    if (project.widgets.length && !confirm('新建会清空当前界面，继续？')) return;
    loadProject(blankProject());
  });
  $('#btnSample').addEventListener('click', () => {
    if (project.widgets.length && !confirm('用示例替换当前界面？')) return;
    loadProject(sampleProject());
  });
  $('#btnOpen').addEventListener('click', () => $('#fileOpen').click());
  $('#fileOpen').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { loadProject(JSON.parse(r.result)); }
      catch (err) { toast('JSON 解析失败'); }
    };
    r.readAsText(f, 'utf-8');
    e.target.value = '';
  });
  $('#btnSave').addEventListener('click', () => {
    download((project.name || 'ui') + '.json', JSON.stringify(serializeProject(), null, 2), 'application/json');
  });
  $('#btnUndo').addEventListener('click', undo);
  $('#btnRedo').addEventListener('click', redo);
  $('#btnCode').addEventListener('click', openCode);
  $('#btnPreview').addEventListener('click', () => {
    document.body.classList.toggle('preview');
    setTimeout(fitIfNeeded, 0);
  });
  $('#previewExit').addEventListener('click', () => document.body.classList.remove('preview'));

  // 添加
  $$('.pal-btn').forEach(b => b.addEventListener('click', () => addWidget(b.dataset.add)));

  // 图层
  $('#layers').addEventListener('click', e => {
    const row = e.target.closest('.layer');
    if (!row) return;
    const uidValue = row.dataset.uid;
    const action = e.target.dataset.action;
    if (action) {
      const w = project.widgets.find(x => x.uid === uidValue);
      if (!w) return;
      if (action === 'toggle') { historyPush(); w.visible = w.visible === false; renderStage(); renderLayers(); saveLocal(); }
      else if (action === 'up') moveLayer(uidValue, 1);
      else if (action === 'down') moveLayer(uidValue, -1);
      return;
    }
    select(uidValue);
  });

  // 画布
  $('#stage').addEventListener('pointerdown', e => {
    if (document.body.classList.contains('preview')) return;
    const handle = e.target.closest('.handle');
    if (handle) {
      const w = selected();
      if (w) startDrag(e, w, 'resize', handle.dataset.dir);
      return;
    }
    const el = e.target.closest('.widget');
    if (!el) { select(null); return; }
    const w = project.widgets.find(x => x.uid === el.dataset.uid);
    if (!w) return;
    select(w.uid);
    if (e.button === 0) startDrag(e, w, 'move');
  });
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  // 属性
  $('#props').addEventListener('input', onPropInput);
  $('#props').addEventListener('change', e => {
    if (e.target.dataset.file === 'preview') {
      const w = selected();
      const f = e.target.files[0];
      if (!w || !f) return;
      const r = new FileReader();
      r.onload = () => { w.previewData = r.result; renderStage(); };
      r.readAsDataURL(f);
      return;
    }
    if (e.target.dataset.prop) onPropInput(e);
  });
  $('#props').addEventListener('click', e => {
    const action = e.target.dataset.action;
    if (!action) return;
    const w = selected();
    if (action === 'load-sample') { loadProject(sampleProject()); return; }
    if (action === 'clear-all') {
      if (!confirm('清空所有控件？')) return;
      historyForce(); project.widgets = []; selectedUid = null; renderAll(); return;
    }
    if (!w) return;
    if (action === 'del') deleteSelected();
    else if (action === 'dup') duplicateSelected();
    else if (action === 'up') moveLayer(w.uid, 1);
    else if (action === 'down') moveLayer(w.uid, -1);
    else if (action === 'top') { historyForce(); const i = project.widgets.indexOf(w); project.widgets.splice(i, 1); project.widgets.push(w); renderAll(); }
    else if (action === 'bottom') { historyForce(); const i = project.widgets.indexOf(w); project.widgets.splice(i, 1); project.widgets.unshift(w); renderAll(); }
  });

  // 网格/缩放
  $('#snapChk').addEventListener('change', e => { snap = e.target.checked; });
  $('#zoomSel').addEventListener('change', applyZoomSelection);
  window.addEventListener('resize', fitIfNeeded);

  // 代码弹窗
  $('#btnCopy').addEventListener('click', copyCode);
  $('#btnDownload').addEventListener('click', () => download('ui_generated.cpp', generatedCode, 'text/plain;charset=utf-8'));
  $('#btnCloseModal').addEventListener('click', closeCode);
  $('#codeModal').addEventListener('click', e => { if (e.target.id === 'codeModal') closeCode(); });

  // 键盘
  window.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'Escape') {
      if (document.body.classList.contains('preview')) document.body.classList.remove('preview');
      else if (!$('#codeModal').classList.contains('hidden')) closeCode();
      else select(null);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); download((project.name || 'ui') + '.json', JSON.stringify(serializeProject(), null, 2), 'application/json'); return; }
    const w = selected();
    if (!w) return;
    const step = e.shiftKey ? 10 : 1;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
      e.preventDefault();
      historyPush();
      if (e.key === 'ArrowLeft') w.x -= step;
      if (e.key === 'ArrowRight') w.x += step;
      if (e.key === 'ArrowUp') w.y -= step;
      if (e.key === 'ArrowDown') w.y += step;
      renderStage(); renderSelection(); syncPosFields(); saveLocal();
    }
  });

  // 拖动时防止选中文字
  document.addEventListener('selectstart', e => { if (drag) e.preventDefault(); });

  renderAll();

  // 调试用：?select=BTN_START 打开时自动选中某个控件
  const selParam = new URLSearchParams(location.search).get('select');
  if (selParam) {
    const w = project.widgets.find(x => String(x.id || '') === selParam);
    if (w) select(w.uid);
  }

  // 测试用：?selftest=1 跑一组核心交互断言
  if (params.has('selftest')) {
    const results = [];
    const ok = (name, cond) => results.push((cond ? 'PASS ' : 'FAIL ') + name);

    const np = normalizeProject({ designW: 800, designH: 600, widgets: [{ type: 'button', x: 123, y: 45, w: 100, h: 50, text: 'x' }] });
    ok('normalize 保留 x', np.widgets[0].x === 123 && np.widgets[0].w === 100);

    const code = generateCode(sampleProject());
    ok('生成 enum', code.includes('UI_BTN_START'));
    ok('生成输入框光标', code.includes('placeCursor'));
    ok('每个按钮独立 hover 作用域', (code.match(/const bool hover/g) || []).length === 3);

    const beforeCount = project.widgets.length;
    addWidget('label');
    ok('添加控件', project.widgets.length === beforeCount + 1);

    const testW = project.widgets[project.widgets.length - 1];
    select(testW.uid);
    const el = document.querySelector('.widget[data-uid="' + testW.uid + '"]');
    if (el) {
      const r = el.getBoundingClientRect();
      const ox = testW.x;
      el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, clientX: r.left + 5, clientY: r.top + 5 }));
      window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: r.left + 45, clientY: r.top + 25 }));
      window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      ok('拖拽改变位置', project.widgets.find(w => w.uid === testW.uid).x !== ox);
    } else {
      ok('拖拽改变位置', false);
    }

    select(testW.uid);
    const sel = document.querySelector('.handle[data-dir="se"]');
    if (sel) {
      const r = sel.getBoundingClientRect();
      const ow = testW.w;
      sel.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, clientX: r.left + 4, clientY: r.top + 4 }));
      window.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: r.left + 44, clientY: r.top + 24 }));
      window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      ok('缩放改变宽高', project.widgets.find(w => w.uid === testW.uid).w !== ow);
    } else {
      ok('缩放改变宽高', false);
    }

    const body = results.join('\n');
    document.body.innerHTML = '<pre id="selftest">' + escHtml(body) + '</pre>';
    return;
  }

  // 测试用：?dumpcode=1 只输出生成的代码，方便命令行验证
  if (params.has('dumpcode')) {
    const code = generateCode(project);
    document.body.innerHTML = '<pre id="dumpcode">' + escHtml(code) + '</pre>';
  }
}

init();
</script>
